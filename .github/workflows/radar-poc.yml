name: Transfer Radar PoC (throwaway)

# Feasibility proof-of-concept only. No database, no Firebase, no deploys.
# Runs when the PoC branch is pushed (workflow_dispatch needs the file on the default branch).
on:
  push:
    branches: [feat/transfer-radar-poc]
    paths:
      - 'radar-poc/**'
      - '.github/workflows/radar-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-poc
  cancel-in-progress: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Run PoC (hard caps 40 requests, 0.25 USD)"
        env:
          RADAR_GEMINI_KEY: ${{ secrets.RADAR_GEMINI_KEY }}
          RADAR_MODEL: gemini-2.5-flash-lite
          INTAKE_DAYS: '30'
          MAX_ITEMS: '240'
          BATCH: '8'
          MAX_REQUESTS: '40'
          MAX_USD: '0.25'
        run: node radar-poc/run.mjs
