name: Request matching — club level data (weekly)

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC (after the Sunday Roster Intelligence run)
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore caches (full rebuild)'
        type: boolean
        default: false
      club:
        description: 'Only this requesting club (TM verein id) — optional'
        type: string
        default: ''

concurrency:
  group: matching-worker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mgsr-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mgsr-web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build club level data
        run: npx tsx _matching_worker.ts ${{ inputs.force && '--force' || '' }} ${{ inputs.club && format('--club={0}', inputs.club) || '' }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TM_HTML_PROXY_URL: ${{ vars.TM_HTML_PROXY_URL || 'https://management.britsportgroup.com/api/transfermarkt/html-proxy' }}
