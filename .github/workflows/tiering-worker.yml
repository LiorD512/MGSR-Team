name: Roster Intelligence weekly agent

# Scores the whole men roster in the background once a week. Nobody clicks anything; the dashboard reads results.
on:
  schedule:
    - cron: '0 2 * * 0' # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore all caches (full refresh)'
        type: boolean
        default: false

concurrency:
  group: tiering-worker
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mgsr-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mgsr-web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Analyse roster
        run: npx tsx _tiering_worker.ts sweep ${{ inputs.force && '--force' || '' }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOUT_SERVER_URL: ${{ vars.SCOUT_SERVER_URL }}
          TIERING_APP_ORIGIN: ${{ vars.TIERING_APP_ORIGIN || 'https://management.britsportgroup.com' }}
          TIERING_ALERT_EMAILS: ${{ vars.TIERING_ALERT_EMAILS }}
          TIERING_CONCURRENCY: '4'
          # Transfermarkt blocks GitHub runner IPs (HTTP 405/202/403). Route TM scrapes through the
          # same shared proxy the other TM workflows use so injury/intel sources work.
          TM_HTML_PROXY_URL: ${{ vars.TM_HTML_PROXY_URL || 'https://management.britsportgroup.com/api/transfermarkt/html-proxy' }}
