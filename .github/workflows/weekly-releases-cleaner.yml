name: Weekly Releases Cleaner (Men)

# Keeps the men's "Latest Releases" screen (/release-notifications) clean by
# hiding released players who have since signed a new club. Non-destructive:
# only toggles `hiddenFromReleases` on FeedEvents — never deletes events.
# Runs on GitHub Actions (same proven TM scraping stack as the returnees /
# contract-finishers weekly jobs) so it is not blocked by Transfermarkt.

on:
  schedule:
    # 05:00 Israel time (02:00 UTC) every Friday.
    # Chosen to avoid colliding with returnees (Thu) and contract-finishers (Mon).
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would be hidden/unhidden, write nothing)'
        type: boolean
        default: false

jobs:
  releases-cleaner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mgsr-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mgsr-web/package-lock.json

      - run: npm ci

      - name: Run releases cleaner
        run: npx tsx _releases_cleaner.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CI: true
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
