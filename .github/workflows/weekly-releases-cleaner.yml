name: Weekly Releases Cleaner (Men)

# Keeps the men's "Latest Releases" screen (/release-notifications) clean by
# hiding released players who have since signed a new club. For each player on
# the screen it reads their TM profile and hides only genuinely-signed players
# (a real current club AND no "to leave / joining Without Club" marker).
# Non-destructive: only toggles `hiddenFromReleases` on FeedEvents — never
# deletes events. Fetches via the shared HTML proxy so TM does not block it.

on:
  schedule:
    # 05:00 Israel time (02:00 UTC) every Friday.
    # Chosen to avoid colliding with returnees (Thu) and contract-finishers (Mon).
    - cron: '0 2 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would be hidden/unhidden, write nothing)'
        type: boolean
        default: false

jobs:
  releases-cleaner:
    runs-on: ubuntu-latest
    # Per-player profile fetches: budget generously (hundreds of profiles).
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mgsr-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mgsr-web/package-lock.json

      - run: npm ci

      - name: Run releases cleaner
        run: npx tsx _releases_cleaner.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CI: true
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # TM blocks plain requests from GH Actions (HTTP 202), so fetch through
          # the shared HTML proxy. Override via repo secret/var if the proxy moves.
          TM_HTML_PROXY_URL: ${{ vars.TM_HTML_PROXY_URL || 'https://management.britsportgroup.com/api/transfermarkt/html-proxy' }}
