name: Transfer Radar pipeline

# Collect -> gate -> AI (free-first, hard-capped paid overflow) -> resolve -> score -> alerts.
# SAFETY: scheduled runs only happen when the repository variable RADAR_ENABLED is exactly 'true'
# (Settings -> Secrets and variables -> Actions -> Variables). Until then nothing spends money.
# Manual / branch-test runs: workflow_dispatch (default branch only) or a push whose commit message contains [radar-run].
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      no_analyze:
        description: 'Skip the AI step (collect + score only)'
        type: boolean
        default: false
  push:
    branches: [feat/transfer-radar]
    paths: ['radar/**', '.github/workflows/radar-pipeline.yml']

permissions:
  contents: read

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

jobs:
  run:
    if: >-
      (github.event_name == 'schedule' && vars.RADAR_ENABLED == 'true') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-run]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: radar/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check required secrets
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          if [ -z "$TURSO_URL" ] || [ -z "$TURSO_TOKEN" ]; then
            echo "::error::Secrets TURSO_URL and TURSO_TOKEN must be set (otherwise data would be written to a throw-away local file)."
            exit 1
          fi
      - name: Run pipeline
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          RADAR_GEMINI_KEY: ${{ secrets.RADAR_GEMINI_KEY }}
          RADAR_GEMINI_FREE_KEY: ${{ secrets.RADAR_GEMINI_FREE_KEY }}
        run: npx tsx src/cli.ts run ${{ inputs.no_analyze && '--no-analyze' || '' }}
