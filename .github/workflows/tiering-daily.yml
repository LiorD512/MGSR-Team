name: Level & Focus daily analysis

on:
  schedule:
    # 03:00 Israel time (00:00 UTC) every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  analyse-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Analyse stale roster players in small batches
        env:
          BASE_URL: ${{ vars.TIERING_BASE_URL || 'https://management.britsportgroup.com' }}
          TIERING_RUN_SECRET: ${{ secrets.TIERING_RUN_SECRET }}
        run: |
          if [ -z "$TIERING_RUN_SECRET" ]; then echo "TIERING_RUN_SECRET is not set"; exit 1; fi
          for i in $(seq 1 25); do
            resp=$(curl -sS -m 90 -X POST "$BASE_URL/api/tiering/run" \
              -H "x-tiering-secret: $TIERING_RUN_SECRET" -H "Content-Type: application/json" \
              -d '{"limit":4}')
            echo "batch $i: $resp"
            remaining=$(echo "$resp" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            processed=$(echo "$resp" | sed -n 's/.*"processed":\([0-9]*\).*/\1/p')
            if [ -z "$remaining" ] || [ "$remaining" = "0" ] || [ "$processed" = "0" ]; then break; fi
          done
