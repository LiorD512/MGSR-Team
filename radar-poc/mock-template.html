<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRIT Sport Group — Transfer Radar (mock with real PoC data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0a;--panel:#141412;--panel2:#1a1a17;--ink:#ece8de;--mut:#8f8b81;--mut2:#6b685f;--gold:#c9a66b;--gold2:#a47d43;--line:rgba(236,232,222,.11);--line2:rgba(236,232,222,.2);--red:#c4584a;--green:#8fa57a;--amber:#d4a24a;
--disp:'Oswald',Impact,sans-serif;--body:'Manrope',Helvetica,sans-serif;--mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:24px 20px;background:#080807;border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
.lock{display:flex;gap:11px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d9bd8a,var(--gold2));color:#0c0c0a;font:600 14px var(--disp)}
.lock b{display:block;font:500 14px/1 var(--disp);letter-spacing:.09em;color:var(--gold)}.lock small{font:9px/1 var(--mono);color:var(--mut2);text-transform:uppercase;display:block;margin-top:5px}
.nav{margin-top:22px;display:grid;gap:2px}.nav a,.nav .g{display:flex;justify-content:space-between;padding:10px 0;font:10px/1 var(--mono);text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
.nav a:hover,.nav a.on{color:var(--gold)}.nav .sub{padding-inline-start:12px;display:grid;border-inline-start:1px solid var(--line);margin:2px 0 8px 2px}.nav .sub a{padding:8px 0;font-size:9px}
.nav .dim{opacity:.45;pointer-events:none}.rail-f{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font:9px/1.6 var(--mono);text-transform:uppercase;color:var(--mut2)}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);font:10px/1 var(--mono);text-transform:uppercase;color:var(--mut)}
.top b{color:var(--ink);font-weight:400}.mockbadge{border:1px solid var(--gold2);color:var(--gold);padding:6px 9px}
.cv{padding:28px 32px 70px;max-width:1500px}
.kick{font:10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
h1{font:500 54px/.9 var(--disp);text-transform:uppercase;letter-spacing:-.02em;margin:0}h1 span{color:var(--gold)}
.sub{color:var(--mut);margin:10px 0 0;max-width:720px;font-size:12px}
.mast{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--panel);margin-bottom:16px}
.kpis div{padding:12px 14px;border-inline-end:1px solid var(--line)}.kpis div:last-child{border:0}
.kpis small{display:block;font:9px/1 var(--mono);text-transform:uppercase;color:var(--mut2);margin-bottom:8px}.kpis b{font:500 22px/1 var(--disp);letter-spacing:.01em}.kpis em{font:10px var(--mono);color:var(--mut);font-style:normal;margin-inline-start:6px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 10px;border:1px solid var(--line2);font:9.5px/1 var(--mono);text-transform:uppercase;color:var(--mut);letter-spacing:.03em}
.chip.on{background:var(--gold);color:#0c0c0a;border-color:var(--gold)}.chip:hover:not(.on){color:var(--ink);border-color:var(--gold2)}
.lbl{font:9px/1 var(--mono);text-transform:uppercase;color:var(--mut2);margin-inline-end:2px}
.search{margin-inline-start:auto;background:var(--panel);border:1px solid var(--line2);padding:7px 10px;color:var(--ink);font:11px var(--mono);width:220px}
table{width:100%;border-collapse:collapse}
th{font:9px/1 var(--mono);text-transform:uppercase;color:var(--mut2);text-align:start;padding:11px 10px;border-bottom:1px solid var(--line2);font-weight:400;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel)}tr.closed td{opacity:.55}
.sc{display:flex;align-items:center;gap:9px;min-width:92px}.sc b{font:500 22px/1 var(--disp);width:32px}.sc i{display:block;height:3px;background:var(--line2);width:46px;position:relative}.sc i u{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.lv{display:inline-block;font:9px/1 var(--mono);text-transform:uppercase;padding:4px 6px;border:1px solid var(--line2);color:var(--mut);margin-top:5px}
.lv.Monitor{color:var(--ink);border-color:var(--ink)}.lv.Potential{color:var(--gold);border-color:var(--gold)}.lv.High{background:var(--gold);color:#0c0c0a;border-color:var(--gold)}.lv.Closed{color:var(--red);border-color:var(--red)}
.nm b{font:600 14px/1.2 var(--body)}.nm small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.tag{display:inline-block;font:9px/1 var(--mono);text-transform:uppercase;padding:4px 6px;margin:0 4px 4px 0;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.vb{display:inline-block;font:9px/1 var(--mono);text-transform:uppercase;padding:4px 6px;letter-spacing:.03em}
.vb.CONFIRMED{background:var(--gold);color:#0c0c0a}.vb.REPORTED{border:1px solid var(--gold);color:var(--gold)}.vb.RUMOR{border:1px dashed var(--mut);color:var(--mut);background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(143,139,129,.14) 4px 5px)}
.vb.AI{border:1px solid #7ea4c9;color:#7ea4c9}
.what{max-width:430px;color:var(--ink)}.what small{display:block;color:var(--mut2);font:10px var(--mono);margin-top:4px}
.urg{font:10px var(--mono);text-transform:uppercase}.urg.High{color:var(--amber)}.urg.Medium{color:var(--ink)}.urg.Low,.urg.Closed{color:var(--mut2)}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-top:22px}
.pan{border:1px solid var(--line);background:var(--panel);padding:14px 16px}.pan h3{margin:0 0 10px;font:500 12px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pan .it{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.pan .it:first-of-type{border-top:0}.pan .it small{display:block;color:var(--mut2);font:10px var(--mono);margin-top:3px}
.cbar{display:flex;align-items:center;gap:8px;margin:7px 0;font:10px var(--mono);text-transform:uppercase;color:var(--mut)}.cbar i{display:block;height:6px;background:var(--gold2)}
.back{font:10px var(--mono);text-transform:uppercase;color:var(--mut);display:inline-block;margin-bottom:16px}.back:hover{color:var(--gold)}
.ph{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.ph h1{font-size:46px}.bigscore{text-align:end}.bigscore b{font:500 64px/.9 var(--disp);color:var(--gold)}.bigscore small{display:block;font:10px var(--mono);color:var(--mut);margin-top:6px;text-transform:uppercase}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;margin-top:20px}
.sec{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-bottom:16px}.sec h3{margin:0 0 12px;font:500 12px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.comp{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.comp:first-of-type{border-top:0}
.comp .bb{height:5px;background:var(--line2);position:relative}.comp .bb u{position:absolute;inset:0 auto 0 0;background:var(--gold)}.comp .n{font:11px var(--mono);text-align:end}
.comp small{display:block;color:var(--mut2);font:10px/1.4 var(--mono);margin-top:4px;grid-column:1/-1}
.cap{margin-top:10px;padding:9px 11px;border:1px dashed var(--amber);color:var(--amber);font:10.5px/1.4 var(--mono)}
.tl{position:relative;padding-inline-start:20px;border-inline-start:1px solid var(--line2);margin-inline-start:4px}
.ev{position:relative;padding:0 0 18px}.ev:before{content:'';position:absolute;inset-inline-start:-25px;top:4px;width:9px;height:9px;background:var(--gold);border-radius:50%}
.ev.sc:before{background:var(--red)}.ev .d{font:10px var(--mono);color:var(--mut);text-transform:uppercase}.ev .d b{color:var(--ink);font-weight:400}
.ev h4{margin:6px 0 3px;font:600 13px/1.35 var(--body)}.ev .o{color:var(--mut);font-size:12px;margin-bottom:5px}.ev q{display:block;margin:6px 0;padding-inline-start:10px;border-inline-start:2px solid var(--gold2);color:#cfc9bb;font-size:12px;quotes:none}
.ev a{font:10px var(--mono);color:var(--gold);text-transform:uppercase}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:12px}.kv span{color:var(--mut2);font:10px var(--mono);text-transform:uppercase;padding-top:2px}.unk{color:var(--mut2);font-style:italic}
.act{border:1px solid var(--gold);padding:12px 14px;color:var(--ink);background:rgba(201,166,107,.06)}.act small{display:block;font:9px var(--mono);color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.ai{border:1px solid rgba(126,164,201,.4);padding:12px 14px;background:rgba(126,164,201,.05);font-size:12px}.ai small{display:block;font:9px var(--mono);color:#7ea4c9;text-transform:uppercase;margin-bottom:6px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{padding:9px 12px;border:1px solid var(--line2);font:9.5px var(--mono);text-transform:uppercase;color:var(--mut)}.btn.pri{background:var(--gold);color:#0c0c0a;border-color:var(--gold)}
.note{margin-top:20px;padding:12px 14px;border:1px solid var(--line);color:var(--mut);font:10.5px/1.6 var(--mono)}
.st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:7px}.st.FEED{background:var(--green)}.st.NO_FEED,.st.ERROR,.st.ROBOTS_DENY{background:var(--red)}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.cols,.grid3{grid-template-columns:1fr}.cv{padding:18px 14px}h1{font-size:38px}.hide-m{display:none}.search{width:100%;margin:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="lock"><div class="mark">B</div><div><b>BRIT SPORT GROUP</b><small>Men · Management</small></div></div>
    <nav class="nav">
      <a class="dim">Dashboard</a><a class="dim">Roster</a><a class="dim">Shortlist</a><a class="dim">Club Requirements</a><a class="dim">Contacts</a>
      <div class="g" style="color:var(--gold)">Signals ▾</div>
      <div class="sub"><a href="#" data-v="dash" id="n-dash">Transfer Radar</a><a href="#" data-v="src" id="n-src">Sources (admin)</a><a class="dim">Market Radar</a><a class="dim">Release alerts</a><a class="dim">Club changes</a></div>
      <a class="dim">War Room</a>
    </nav>
    <div class="rail-f"><b style="color:var(--ink);font-weight:400">Mock</b><br>Real data from the feasibility PoC</div>
  </aside>
  <main>
    <div class="top"><span>Signals / <b>Transfer Radar</b></span><span class="mockbadge">Mock UI · real PoC data · not production</span></div>
    <div class="cv" id="cv"></div>
  </main>
</div>
<script>
/*__DATA__*/
const D=DATA;const S={view:'dash',pid:null,country:'All',level:'All',sort:'score',q:'',days:30};
const fmtD=ts=>new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).replace(',','')+' UTC';
const ago=ts=>{const h=(D.now-ts)/36e5;return h<1?'<1h ago':h<48?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lvCls=l=>l==='High priority'||l==='Exceptional'?'High':l;
function kpis(){const act=D.players.filter(p=>!p.closed&&p.score>=0);const ok=D.sources.filter(s=>s.status==='FEED').length;
return `<div class="kpis"><div><small>Sources reachable</small><b>${ok}</b><em>of ${D.sources.length}</em></div><div><small>Items in 30-day window</small><b>${D.stats.inWindow.toLocaleString()}</b></div><div><small>Analyzed by AI</small><b>${D.analyzed}</b><em>$${D.usd.toFixed(3)}</em></div><div><small>Carry a signal</small><b>${D.signals}</b></div><div><small>Players in the list</small><b>${act.length}</b><em>+${D.players.filter(p=>p.closed).length} closed</em></div><div><small>Leads needing a name</small><b>${D.leads.length}</b></div></div>`}
function dash(){
 const countries=['All',...new Set(D.players.map(p=>p.country).filter(c=>c!=='—'))];
 let list=D.players.filter(p=>(S.country==='All'||p.country===S.country)&&(S.level==='All'||(S.level==='Monitor+'?p.score>=30&&!p.closed:S.level==='Loan'?p.loan:p.score<30||p.closed))&&(D.now-p.last)/864e5<=S.days&&(!S.q||(p.name+p.club).toLowerCase().includes(S.q.toLowerCase())));
 const key={score:(a,b)=>(a.closed-b.closed)||b.score-a.score,new:(a,b)=>b.last-a.last,rel:(a,b)=>(a.bestTier>b.bestTier?1:-1)||b.score-a.score,urg:(a,b)=>['High','Medium','Low','Closed'].indexOf(a.urgency)-['High','Medium','Low','Closed'].indexOf(b.urgency)||b.score-a.score}[S.sort];
 list=list.sort(key);
 const rows=list.map(p=>`<tr class="row ${p.closed?'closed':''}" data-p="${p.id}"><td><div class="sc"><b>${p.score}</b><i><u style="width:${p.score}%"></u></i></div><span class="lv ${lvCls(p.level)}">${p.level}</span></td>
 <td class="nm"><b>${esc(p.name)}</b><small>${esc(p.club)}</small></td><td>${p.flag} ${esc(p.country)}</td>
 <td>${p.cats.map(c=>`<span class="tag">${c}</span>`).join('')}${p.loan?'<span class="tag">Loan</span>':''}</td>
 <td class="what">${esc(p.top.en)}<small>${esc(p.top.host)} · tier ${p.top.tier} · ${ago(p.last)}</small></td>
 <td>${p.reports.length} report${p.reports.length>1?'s':''}<br><small style="color:var(--mut2);font:10px var(--mono)">${p.origins} independent origin${p.origins>1?'s':''}</small></td>
 <td><span class="vb ${p.bestVer}">${p.bestVer}</span></td><td><span class="urg ${p.urgency}">${p.urgency}</span></td></tr>`).join('');
 const byC={};D.players.filter(p=>!p.closed).forEach(p=>byC[p.country]=(byC[p.country]||0)+1);const mx=Math.max(...Object.values(byC));
 return `<div class="mast"><div><p class="kick">Signals · Transfer Radar</p><h1>Morning <span>Brief</span></h1><p class="sub">Players who may become available — sorted by what changed. Window: last 30 days. Data: ${new Date(D.generatedAt).toUTCString().slice(0,22)} UTC scan of ${D.sources.length} local outlets (${new Set(D.sources.map(s=>s.cc)).size} countries).</p></div></div>
 ${kpis()}
 <div class="bar"><span class="lbl">Country</span><div class="chips">${countries.map(c=>`<button class="chip ${S.country===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
 <div class="bar"><span class="lbl">Show</span><div class="chips">${['All','Monitor+','Loan','Low / closed'].map(l=>`<button class="chip ${S.level===l?'on':''}" data-l="${l}">${l}</button>`).join('')}</div>
 <span class="lbl" style="margin-inline-start:12px">Age of info</span><div class="chips">${[7,14,30].map(d=>`<button class="chip ${S.days===d?'on':''}" data-d="${d}">${d}d</button>`).join('')}</div>
 <span class="lbl" style="margin-inline-start:12px">Sort</span><div class="chips">${[['score','Highest score'],['new','Newest'],['rel','Most reliable'],['urg','Most urgent']].map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>
 <input class="search" placeholder="Search player or club…" value="${esc(S.q)}" id="q"></div>
 <table><thead><tr><th>Score</th><th>Player</th><th>Country</th><th class="hide-m">Signal type</th><th>What happened</th><th>Sources</th><th>Status</th><th>Urgency</th></tr></thead><tbody>${rows||'<tr><td colspan=8 style="padding:30px;color:var(--mut)">No players match the filters.</td></tr>'}</tbody></table>
 <div class="grid3">
  <div class="pan"><h3>Leads needing a name · ${D.leads.length}</h3>${D.leads.map(l=>`<div class="it"><a href="${esc(l.link)}" target="_blank">${esc(l.en||l.title)}</a><small>${esc(l.host)} · ${esc(l.club||'club n/a')} · ${ago(l.ts)} · player not named in headline → article read needed</small></div>`).join('')}</div>
  <div class="pan"><h3>Opportunities by country</h3>${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="cbar"><span style="width:130px">${esc(c)}</span><i style="width:${n/mx*120}px"></i>${n}</div>`).join('')}
   <h3 style="margin-top:18px">New sources (examples)</h3><div class="it">sportacentrs.com <small>Latvia · feed found · 41 items</small></div><div class="it">sport.err.ee <small>Estonia · feed found · 50 items</small></div><div class="it">sport24.gr <small>Greece · no feed (limitation recorded)</small></div></div>
  <div class="pan"><h3>Removed by review · ${D.removed.length}</h3>${D.removed.slice(0,9).map(r=>`<div class="it">${esc(r.player||'')} — ${esc(r.title).slice(0,70)}<small>${esc(r.why)} · ${esc(r.host)}</small></div>`).join('')}<div class="it"><small>The AI proposed these; rules and review dropped them (stars, national teams, other sports, coaches). Shown for transparency.</small></div></div>
 </div>
 <div class="note">MOCK — every headline, link, date, source, AI label and quote is real output of the feasibility run. Scores come from a prototype of the scoring rules using only these reports; age, position, contract and photo are not shown because the football-database join does not exist yet (Phase 1). Source tiers and "independent origin" groups are mock assumptions.</div>`}
function profile(){const p=D.players.find(x=>x.id===S.pid);
 const comps=Object.entries(p.comps);const names={availability:'Transfer availability',exclusion:'Sporting status',relationship:'Relationship issues'};
 const conf=p.reports.filter(r=>r.ver==='CONFIRMED'),rep=p.reports.filter(r=>r.ver==='REPORTED'),rum=p.reports.filter(r=>r.ver==='RUMOR');
 const ai=p.closed?`Earlier reports (club open to sell, player not in matchday squad) were followed within hours by statements that a transfer is confirmed/announced. Treat as likely moved; the open question is only whether the deal completes.`:
 `${p.cats.length>1?'Signals from more than one category ('+p.cats.map(c=>c.split(' · ')[1]).join(', ')+') point the same way. ':''}${p.origins>1?p.origins+' independent origins report it. ':'Only one independent origin so far — not enough to treat as established. '}Not confirmed by the club${conf.length?' except where marked':''}. Contract expiry is unknown; if it ends within 6 months this would move up.`;
 return `<a class="back" href="#" data-v="dash">← Morning Brief</a>
 <div class="ph"><div><p class="kick">${p.flag} ${esc(p.country)} · Player intelligence profile</p><h1>${esc(p.name)}</h1><p class="sub">${esc(p.club)}${p.unresolvedClub?' — <span class="unk">club not stated in the headline (entity resolution pending)</span>':''} ${p.note?'· '+esc(p.note):''}</p>
 <div style="margin-top:12px"><span class="vb ${p.bestVer}">${p.bestVer}</span> <span class="tag">${p.reports.length} reports</span><span class="tag">${p.origins} independent origin${p.origins>1?'s':''}</span><span class="tag">Urgency: ${p.urgency}</span>${p.closed?'<span class="tag" style="color:var(--red);border-color:var(--red)">Status change: transfer confirmed</span>':''}</div></div>
 <div class="bigscore"><b>${p.score}</b><small>/ 100 · ${p.level}</small></div></div>
 <div class="cols"><div>
  <div class="sec"><h3>Why this score</h3>${comps.length?comps.map(([k,c])=>`<div class="comp"><div>${names[k]}</div><div class="bb"><u style="width:${c.pts/c.max*100}%"></u></div><div class="n">${c.pts}/${c.max}</div><small>${c.signal} · ${esc(c.host)} (tier ${c.tier}, ${c.ver}) · confidence ${c.conf} × recency ${c.rec}</small></div>`).join(''):'<div class="unk">No scoring components.</div>'}
   <div class="comp"><div>Independent sources</div><div class="bb"><u style="width:${p.indep/10*100}%"></u></div><div class="n">${p.indep}/10</div><small>${p.origins} distinct origin(s). Duplicate/rewritten reports are not counted as confirmation.</small></div>
   <div class="comp"><div>Contract situation</div><div class="bb"></div><div class="n unk">?/10</div><small>Unknown — needs football-database join (Phase 1/2).</small></div>
   <div class="comp"><div>Club finance · replacement · other</div><div class="bb"></div><div class="n">0/15</div><small>No reports found.</small></div>
   ${p.caps.map(c=>`<div class="cap">⚑ ${esc(c)}</div>`).join('')}</div>
  <div class="sec"><h3>Intelligence timeline · newest first</h3><div class="tl">${p.reports.map(r=>`<div class="ev ${r.completed?'sc':''}"><div class="d"><b>${fmtD(r.ts)}</b> · ${esc(r.host)} · tier ${r.tier} · <span class="vb ${r.ver}">${r.ver}</span>${r.completed?' · <span style="color:var(--red)">STATUS CHANGE</span>':''}</div>
   <h4>${esc(r.en||r.title)}</h4><div class="o">Original: ${esc(r.title)}</div>${r.quote?`<q>“${esc(r.quote)}”</q>`:''}<div class="d">${r.signals.length?r.signals.join(' · ')+' · ':''}claim: ${r.claim} <a href="${esc(r.link)}" target="_blank" style="margin-inline-start:8px">Open source ↗</a></div></div>`).join('')}</div></div>
 </div><div>
  <div class="act"><small>Recommended next action · rule-based</small>${esc(p.action)}<div class="btns"><span class="btn pri">Add to shortlist</span><span class="btn">WhatsApp share</span><span class="btn">Mark contacted</span><span class="btn">Dismiss</span></div></div>
  <div class="sec" style="margin-top:16px"><h3>Facts</h3><div class="kv"><span>Confirmed</span><div>${conf.length?conf.map(r=>esc(r.en)).join('<br>'):'<span class="unk">Nothing confirmed by an official source yet.</span>'}</div>
   <span>Age / DOB</span><div class="unk">Unknown</div><span>Nationality</span><div class="unk">Unknown</div><span>Position</span><div class="unk">Unknown</div><span>Contract expiry</span><div class="unk">Unknown (not verified)</div><span>Minutes</span><div class="unk">Unknown (Phase 2)</div></div></div>
  <div class="sec"><h3>Reported / rumor</h3><div class="kv"><span>Reported</span><div>${rep.length?rep.slice(0,3).map(r=>esc(r.en)).join('<br><br>'):'<span class="unk">—</span>'}</div><span>Rumor</span><div>${rum.length?rum.map(r=>esc(r.en)).join('<br><br>'):'<span class="unk">—</span>'}</div></div></div>
  <div class="ai"><small><span class="vb AI">AI</span> Assessment · generated, not a source fact</small>${esc(ai)}</div>
 </div></div>
 <div class="note">MOCK — reports, links and quotes are real PoC output. The score is a prototype calculation (confidence = 0.4 + 0.6 × source tier × verification, recency floor 0.5) and will be recalibrated against known cases in Phase 1.</div>`}
function sources(){const rows=D.sources.slice().sort((a,b)=>b.relevant-a.relevant||b.items-a.items).map(s=>`<tr><td><span class="st ${s.status}"></span>${esc(s.host)}</td><td>${esc(s.cc)}</td><td>${s.status==='FEED'?'RSS/Atom':'—'}</td><td>${s.tier}</td><td>${s.items}</td><td>${s.relevant}</td><td>${s.status==='FEED'?'<span class="vb REPORTED">PROBATION</span>':'<span class="vb RUMOR">'+s.status.replace('_',' ')+'</span>'}</td><td style="color:var(--mut2);font:10px var(--mono)">${s.status==='FEED'?'Just now':'—'}</td><td style="color:var(--mut2);font:10px var(--mono)">${s.status==='FEED'?'every 30–60 min':'alt. access needed'}</td></tr>`).join('');
 return `<div class="mast"><div><p class="kick">Signals · Admin</p><h1>Source <span>Center</span></h1><p class="sub">Real result of probing ${D.sources.length} local outlets. Newly discovered sources start on probation until you approve them.</p></div></div>
 <table><thead><tr><th>Source</th><th>Country</th><th>Access</th><th>Tier (prior)</th><th>Feed items</th><th>With signal</th><th>Status</th><th>Last scan</th><th>Frequency</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="note">Sources with no usable feed (e.g. sport24.gr) are flagged with the limitation and an alternative (headline search, manual add) — the system never bypasses blocks.</div>`}
function render(){document.getElementById('cv').innerHTML=S.view==='dash'?dash():S.view==='prof'?profile():sources();
 document.getElementById('n-dash').classList.toggle('on',S.view!=='src');document.getElementById('n-src').classList.toggle('on',S.view==='src');wire()}
function wire(){document.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{S.view='prof';S.pid=e.dataset.p;window.scrollTo(0,0);render()});
 document.querySelectorAll('[data-v]').forEach(e=>e.onclick=ev=>{ev.preventDefault();S.view=e.dataset.v;render()});
 document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{S.country=e.dataset.c;render()});document.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{S.level=e.dataset.l;render()});
 document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{S.days=+e.dataset.d;render()});document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.sort=e.dataset.s;render()});
 const q=document.getElementById('q');if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
const h=location.hash.replace('#','');if(h.startsWith('p:')){S.view='prof';S.pid=h.slice(2)}else if(h==='sources')S.view='src';
render();
</script>
</body>
</html>
