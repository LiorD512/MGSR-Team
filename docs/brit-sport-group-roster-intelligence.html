<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIT — Dashboard · Roster intelligence (weekly ranked targets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens + shell copied from mgsr-web globals.css (.brit-room) so this mock matches production */
.brit-room{--ink:#161613;--black:#11110f;--paper:#f3f0e8;--paper-2:#e4ded1;--card:#fbf9f3;--gold:#a47d43;--gold-soft:#c9a66b;--red:#b64235;--green:#5c6f4a;--amber:#b07a2b;--blue:#4a5f6f;--muted:#77736a;--muted-2:#aba69b;--line:rgba(22,22,19,.18);--line-2:rgba(22,22,19,.07);--dark-line:rgba(243,240,232,.2);--display:'Oswald',Impact,sans-serif;--body:'Manrope',Helvetica,sans-serif;--mono:'DM Mono',monospace;min-height:100vh;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.brit-room[dir=rtl]{--display:'Heebo',sans-serif;--body:'Heebo',sans-serif;--mono:'Heebo',sans-serif}
.brit-room *,.brit-room *::before,.brit-room *::after{box-sizing:border-box}
body{margin:0;background:var(--paper)}
.brit-room::before{content:'';position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
.brit-room a{color:inherit;text-decoration:none}.brit-room button{border:0;color:inherit;font:inherit;cursor:pointer;background:transparent}
.brit-app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.brit-rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:25px 22px;background:var(--black);color:var(--paper)}
.brit-lockup{display:flex;align-items:center;gap:12px;padding-bottom:25px;border-bottom:1px solid var(--dark-line)}
.brit-lockup .lg{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-soft);display:grid;place-items:center;color:var(--gold-soft);font:600 15px var(--display)}
.brit-lockup strong{display:block;font:600 15px/1 var(--display);letter-spacing:.08em}.brit-lockup small{display:block;margin-top:5px;color:#aaa59b;font:9px/1 var(--mono);text-transform:uppercase}
.brit-nav{display:grid;gap:3px;margin-top:28px}.brit-nav a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase;cursor:pointer}
.brit-nav a:hover,.brit-nav a.active{color:var(--gold-soft)}.brit-nav a.active::before{content:'';width:20px;height:1px;margin-inline-end:-20px;background:var(--gold-soft)}
.brit-nav em{color:var(--gold-soft);font-style:normal}
.brit-rail-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--dark-line);color:#979289;font:9px/1.6 var(--mono);text-transform:uppercase}.brit-rail-footer strong{display:block;color:var(--paper);font-weight:400}
.brit-topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 43px;background:var(--black);color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase}
.brit-topbar strong{color:var(--paper);font-weight:400}.brit-actions{display:flex;align-items:center;gap:19px}.brit-actions button{color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase}.brit-actions button:hover{color:var(--gold-soft)}
.brit-avatar{width:28px;height:28px;display:grid;place-items:center;background:var(--gold-soft);color:var(--ink);font:11px/1 var(--display)}
.brit-ps{display:inline-flex;padding:3px;border:1px solid var(--dark-line);border-radius:999px;position:relative}.brit-ps span{padding:7px 16px;border-radius:999px;font:600 11px/1 var(--display);letter-spacing:.07em;color:#8e8b82}.brit-ps span.on{background:var(--gold-soft);color:var(--ink)}
.brit-canvas{max-width:1540px;padding:43px}
.brit-kicker{margin:0 0 18px;color:var(--gold);font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.brit-masthead{margin-bottom:49px}.brit-masthead h1{margin:0;font:500 clamp(56px,7vw,104px)/.78 var(--display);letter-spacing:-.045em;text-transform:uppercase}.brit-masthead h1 span{color:var(--gold)}
.brit-room[dir=rtl] .brit-masthead h1{letter-spacing:normal;font-weight:800;line-height:.95}
.brit-signals{display:grid;grid-template-columns:2fr repeat(2,1fr);margin-bottom:59px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.brit-signal{min-height:116px;padding:18px 20px 20px 0;border-inline-end:1px solid var(--line)}.brit-signal:not(:first-child){padding-inline-start:20px}.brit-signal:last-child{border-inline-end:0}
.brit-signal label{display:block;color:var(--muted);font:9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brit-signal strong{display:block;margin-top:14px;font:500 clamp(30px,3.6vw,50px)/.8 var(--display);text-transform:uppercase}.brit-signal .brit-red{color:var(--red)}
.brit-signal small{display:block;margin-top:10px;color:var(--muted);font:9px/1 var(--mono)}
.brit-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(300px,.78fr);gap:56px}
.brit-module{margin-bottom:56px}
.brit-module-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.brit-module-head h2{margin:0;font:500 27px/.9 var(--display);text-transform:uppercase}.brit-room[dir=rtl] .brit-module-head h2{font-weight:800;letter-spacing:normal}
.brit-module-head span,.brit-module-head a,.brit-module-head button{color:var(--muted);font:9px/1 var(--mono);text-transform:uppercase}.brit-module-head a:hover,.brit-module-head button:hover{color:var(--gold)}
.brit-heading-gold{color:var(--gold)}
.brit-deadline{display:grid;grid-template-columns:57px 1fr auto;gap:18px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}
.brit-deadline .brit-code{color:var(--gold);font:10px/1 var(--mono)}.brit-deadline h3{margin:0 0 4px;font:500 24px/.9 var(--display);text-transform:uppercase}
.brit-deadline p{margin:0;color:var(--muted);font:9px/1.4 var(--mono);text-transform:uppercase}.brit-deadline time{color:var(--gold);text-align:end;font:500 18px/.9 var(--display);text-transform:uppercase}.brit-deadline time.brit-red{color:var(--red)}
.brit-birthday-btn{padding:8px 10px;background:var(--gold-soft);color:var(--ink);font:9px/1 var(--mono);text-transform:uppercase;margin-inline-end:12px}.brit-birthday-btn:hover{background:var(--gold);color:var(--paper)}
.brit-black-module{padding:25px 26px 8px;background:var(--black);color:var(--paper)}.brit-black-module .brit-module-head{border-color:var(--dark-line)}.brit-black-module .brit-module-head h2{color:var(--paper)}.brit-black-module .brit-module-head span{color:#aaa69c}
.brit-approval{display:grid;grid-template-columns:48px 1fr auto;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid var(--dark-line)}
.brit-avatar-box{width:48px;height:58px;display:grid;place-items:center;background:rgba(243,240,232,.08);color:#aaa69c;font:500 18px/1 var(--display)}
.brit-approval h3{margin:0 0 4px;font:500 22px/.9 var(--display);text-transform:uppercase}.brit-approval p{margin:0;color:#aaa69c;font:9px/1.4 var(--mono);text-transform:uppercase}
.brit-approve-btn{padding:9px 10px;background:var(--gold-soft);color:var(--ink);font:9px/1 var(--mono);text-transform:uppercase}
.brit-mandates{display:grid;grid-template-columns:repeat(3,1fr)}.brit-mandate{padding:18px 16px 20px 0;border-bottom:1px solid var(--line)}.brit-mandate:not(:first-child){padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.brit-mandate strong{display:block;margin-bottom:7px;font:500 23px/.9 var(--display);text-transform:uppercase}.brit-mandate span{color:var(--red);font:9px/1 var(--mono);text-transform:uppercase}
.brit-mandate p{min-height:30px;margin:10px 0 14px;color:var(--muted);font:9px/1.4 var(--mono)}.brit-mandate a{padding:0 0 4px;border-bottom:1px solid var(--ink);font:9px/1 var(--mono);text-transform:uppercase;cursor:pointer}
.brit-feed-row{display:grid;grid-template-columns:70px 1fr auto;gap:18px;padding:15px 0;border-top:1px solid var(--line);align-items:start}.brit-feed-row time{color:var(--muted);font:9px/1 var(--mono)}.brit-feed-row p{margin:0;font-size:11px}.brit-feed-row p strong{display:block;margin-top:3px}.brit-feed-row span{color:var(--gold);font:9px/1 var(--mono);text-transform:uppercase;white-space:nowrap}
.brit-new-request{display:block;width:100%;margin-top:18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--gold);font:9px/1 var(--mono);text-transform:uppercase}
.brit-focus{display:grid;grid-template-columns:1fr 1fr;gap:16px}.brit-focus article{position:relative;min-height:190px;overflow:hidden;background:linear-gradient(160deg,#23231f,#11110f)}
.brit-focus article::after{content:'';position:absolute;inset:52% 0 0;background:rgba(17,17,15,.76)}.brit-focus-copy{position:absolute;inset-inline:16px;bottom:16px;z-index:1;color:var(--paper)}
.brit-focus-copy small{display:block;color:var(--gold-soft);font:9px/1 var(--mono);text-transform:uppercase}.brit-focus-copy h3{margin:6px 0 0;font:500 24px/.9 var(--display);text-transform:uppercase}
.brit-empty{padding:22px 0;color:var(--muted);font:9px/1.4 var(--mono);text-transform:uppercase}

/* push notification */
.notif{position:fixed;top:92px;inset-inline-end:24px;z-index:90;width:360px;background:var(--black);color:var(--paper);border-inline-start:3px solid var(--red);padding:16px 18px;transform:translateX(130%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.brit-room[dir=rtl] .notif{transform:translateX(-130%)}.notif.show{transform:none!important}
.notif small{display:flex;justify-content:space-between;color:var(--gold-soft);font:8px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em}.notif b{display:block;margin:8px 0 4px;font:500 20px/1 var(--display);text-transform:uppercase}.notif p{margin:0;color:#b9b5aa;font:10px/1.5 var(--mono)}.notif button{margin-top:10px;color:var(--gold-soft);font:9px var(--mono);text-transform:uppercase;border-bottom:1px solid var(--gold-soft)}
.toast{position:fixed;left:24px;bottom:70px;z-index:90;padding:13px 16px;background:var(--black);color:var(--paper);border-left:3px solid var(--gold);font:10px/1.4 var(--mono);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}
.mockbar{position:fixed;left:0;right:0;bottom:0;z-index:95;display:flex;gap:10px;align-items:center;padding:9px 14px;background:#fff;border-top:2px dashed var(--gold);font:10px/1 var(--mono);text-transform:uppercase}
.mockbar b{color:var(--gold)}.mockbar button{padding:7px 10px;border:1px solid var(--ink)}.mockbar button:hover{background:var(--ink);color:#fff}.mockbar span{color:var(--muted)}
.brit-canvas{padding-bottom:90px}
@media(max-width:1100px){.brit-app{grid-template-columns:1fr}.brit-rail{display:none}.brit-grid{grid-template-columns:1fr}.brit-canvas{padding:24px}.brit-topbar{padding:0 20px}.brit-signals{grid-template-columns:1fr}.brit-signal{border:0;padding-inline-start:0!important}}
/* ═══════════════════════════════════════════════════════
   Level & Focus — Roster intelligence (dashboard module)
   Scoped to .brit-room; uses the room's own tokens.
   ═══════════════════════════════════════════════════════ */
.brit-room .ri-l1 { background: #11110f; color: #f3f0e8; }
.brit-room .ri-l2 { background: var(--gold); color: #fff; }
.brit-room .ri-l3 { background: var(--gold-soft); color: var(--ink); }
.brit-room .ri-l4 { background: var(--muted-2); color: var(--ink); }
.brit-room .ri-l5 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--muted-2); }
.brit-room .ri-link { color: var(--gold); font: 9px/1 var(--mono); text-transform: uppercase; text-decoration: underline; }
.brit-room .ri-link-gold { color: var(--gold-soft); margin-top: 12px; }
.brit-room .ri-red { color: var(--red); }
.brit-room .ri-muted { color: var(--muted); font: 10px var(--mono); }
.brit-room .ri-end { text-align: end; }

.brit-room .ri-bar { display: flex; height: 34px; margin: 20px 0 9px; border: 1px solid var(--ink); }
.brit-room .ri-bar button { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; font: 500 15px/1 var(--display); transition: opacity 0.2s, filter 0.2s; }
.brit-room .ri-bar button:hover { filter: brightness(1.12); }
.brit-room .ri-bar.dim button:not(.sel) { opacity: 0.35; }
.brit-room .ri-key { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.brit-room .ri-key button { text-align: start; padding: 0; color: var(--muted); font: 9px/1.35 var(--mono); text-transform: uppercase; }
.brit-room .ri-key button b { display: block; color: var(--ink); font-weight: 500; }
.brit-room .ri-key button:hover b, .brit-room .ri-key button.sel b { color: var(--gold); }

.brit-room .ri-call { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin: 22px 0 4px; padding: 14px 16px; border: 1px solid var(--gold-soft); background: color-mix(in srgb, var(--gold-soft) 8%, transparent); }
.brit-room .ri-call-icon { width: 32px; height: 32px; display: grid; place-items: center; background: var(--gold-soft); color: var(--ink); font: 12px/1 var(--display); }
.brit-room .ri-call b { display: block; font: 500 15px/1.1 var(--display); text-transform: uppercase; }
.brit-room .ri-call small { display: block; margin-top: 3px; color: var(--gold); font: 9px/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
.brit-room .ri-call > button { padding: 9px 11px; background: var(--ink); color: var(--paper); font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-call > button:hover { background: var(--gold); }

.brit-room .ri-tabs { display: flex; gap: 18px; margin-top: 22px; border-bottom: 1px solid var(--line-2); }
.brit-room .ri-tabs button { margin-bottom: -1px; padding: 0 0 9px; border-bottom: 2px solid transparent; color: var(--muted); font: 9px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.brit-room .ri-tabs button.on { color: var(--ink); border-color: var(--gold); }
.brit-room .ri-tabs button i { margin-inline-start: 4px; color: var(--gold); font-style: normal; }

.brit-room .ri-table { width: 100%; border-collapse: collapse; }
.brit-room .ri-table th { padding: 13px 0 9px; color: var(--muted); text-align: start; font: 9px/1 var(--mono); font-weight: 400; text-transform: uppercase; }
.brit-room .ri-table th.ri-end { text-align: end; }
.brit-room .ri-table td { padding: 13px 0; border-top: 1px solid var(--line); font: 10px/1.25 var(--mono); vertical-align: middle; }
.brit-room .ri-table tbody tr { cursor: pointer; transition: background 0.2s; }
.brit-room .ri-table tbody tr:hover { background: rgba(164, 125, 67, 0.07); }
.brit-room .ri-table td.ri-pl { padding-inline-end: 6px; font: 700 12.5px/1.25 var(--body); }
.brit-room .ri-table td.ri-pl small { display: block; margin-top: 3px; color: var(--muted); font: 9px/1.2 var(--mono); font-weight: 400; text-transform: uppercase; }
.brit-room .ri-table td.ri-nx { color: var(--muted); white-space: nowrap; }
.brit-room .ri-table td.ri-nx.hot { color: var(--red); }

.brit-room .ri-lv { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.brit-room .ri-lv b { min-width: 26px; height: 20px; display: inline-grid; place-items: center; font: 500 11px/1 var(--display); letter-spacing: 0.03em; }
.brit-room .ri-lv.sg b { outline: 1.5px dashed var(--gold); outline-offset: 2px; }
.brit-room .ri-lv b.ri-o { opacity: 0.5; }
.brit-room .ri-tr { font-size: 8px; font-style: normal; }
.brit-room .ri-tr.up { color: var(--green); }
.brit-room .ri-tr.down { color: var(--red); }
.brit-room .ri-tr.flat { color: var(--muted-2); }

.brit-room .ri-fc { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-transform: uppercase; font: 10px/1 var(--mono); }
.brit-room .ri-fc s { width: 7px; height: 7px; display: inline-block; border-radius: 50%; text-decoration: none; }
.brit-room .ri-fc1 { color: var(--red); } .brit-room .ri-fc1 s { background: var(--red); }
.brit-room .ri-fc2 s { background: var(--ink); }
.brit-room .ri-fc3 { color: var(--muted); } .brit-room .ri-fc3 s { background: var(--muted); }
.brit-room .ri-fc4 { color: var(--muted); } .brit-room .ri-fc4 s { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted-2); }
.brit-room .ri-bgf1 { background: var(--red) !important; color: #fff !important; }
.brit-room .ri-bgf2 { background: var(--ink) !important; color: #fff !important; }
.brit-room .ri-bgf3 { background: var(--muted) !important; color: #fff !important; }
.brit-room .ri-bgf4 { background: var(--muted-2) !important; color: var(--ink) !important; }

.brit-room .ri-more { display: flex; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-more button { color: var(--gold); font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-eff { margin-top: 20px; }
.brit-room .ri-eff-row { display: flex; justify-content: space-between; color: var(--muted); font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-eff-row b { color: var(--ink); font-weight: 500; }
.brit-room .ri-eff-track { position: relative; height: 6px; margin: 9px 0 8px; background: var(--paper-2); }
.brit-room .ri-eff-track i { position: absolute; inset: 0 auto 0 0; background: var(--red); }
.brit-room[dir='rtl'] .ri-eff-track i { inset: 0 0 0 auto; }
.brit-room .ri-eff-track u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.brit-room .ri-eff p { margin: 0; color: var(--muted); font: 9px/1.5 var(--mono); }
.brit-room .ri-first { padding: 24px 0; }
.brit-room .ri-first p { margin: 0 0 6px; font: 12px/1.5 var(--body); }
.brit-room .ri-first .ri-first-sub { margin-bottom: 14px; color: var(--muted); font: 9px/1.4 var(--mono); text-transform: uppercase; }

.brit-room .ri-btn { display: inline-block; padding: 11px 14px; border: 1px solid var(--ink); font: 9px/1 var(--mono); text-transform: uppercase; text-align: center; }
.brit-room .ri-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.brit-room .ri-btn:disabled { opacity: 0.5; cursor: default; }
.brit-room .ri-btn-gold { background: var(--gold-soft); border-color: var(--gold-soft); color: var(--ink); }
.brit-room .ri-btn-gold:hover:not(:disabled) { background: var(--gold); border-color: var(--gold); color: var(--paper); }

/* drawer / modal */
.brit-room .ri-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(17, 17, 15, 0.66); }
.brit-room .ri-drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 71; width: min(560px, 100%); overflow: auto; background: var(--paper); border-inline-start: 4px solid var(--gold); animation: ri-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes ri-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.brit-room[dir='rtl'] .ri-drawer { animation-name: ri-in-rtl; }
@keyframes ri-in-rtl { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
.brit-room .ri-dr-h { padding: 26px 28px 22px; background: var(--black); color: var(--paper); }
.brit-room .ri-x { float: inline-end; font: 22px var(--display); }
.brit-room .ri-dr-h small { color: #aaa69c; font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-dr-h h2 { margin: 8px 0 12px; font: 500 42px/0.9 var(--display); text-transform: uppercase; }
.brit-room[dir='rtl'] .ri-dr-h h2 { font-weight: 800; letter-spacing: normal; }
.brit-room .ri-dr-tags { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.brit-room .ri-dr-h .ri-fc2 { color: var(--paper); } .brit-room .ri-dr-h .ri-fc2 s { background: var(--paper); }
.brit-room .ri-unconf { color: var(--gold-soft); font: 9px/1 var(--mono); text-transform: uppercase; }
.brit-room .ri-dr-s { padding: 20px 28px; border-bottom: 1px solid var(--line); }
.brit-room .ri-dr-s h4 { margin: 0 0 12px; display: flex; justify-content: space-between; color: var(--muted); font: 9px/1 var(--mono); font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; }
.brit-room .ri-ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.brit-room .ri-ladder button, .brit-room .ri-fseg button { position: relative; border: 1px solid var(--line); background: var(--card); text-align: center; }
.brit-room .ri-ladder button { padding: 10px 2px 9px; }

  ${p.news.length?`<div class="ri-dr-s"><h4><span>${L('news')}</span></h4>${p.news.map(n=>`<div class="ri-news ri-ns-${n.s}"><b>${n.h}</b><p>${tt(n.i)}</p><small>${n.src}</small></div>`).join('')}${p.srcs.length?`<div class="ri-srcs">${p.srcs.map(s=>`<a href="#" onclick="return false">${s}</a>`).join('')}</div>`:''}</div>`:''}
  <div class="ri-dr-s"><h4><span>${L('basis')}</span></h4>${p.c.map(([k,wt,v])=>`<div class="ri-sig"><span>${L('crit')[k]}<em>${wt}%</em></span><div class="ri-sig-tr"><i style="width:${v[0]||0}%;opacity:${v[0]==null?.2:1}"></i></div><span>${v[0]??'—'}</span>${v[1]?`<small>${v[1]}</small>`:''}</div>`).join('')}</div>
  <div class="ri-dr-s"><h4><span>${L('effort')}</span></h4><div class="ri-touch"><div><b>1</b>${L('notes')}</div><div><b>0</b>${L('tasks')}</div><div><b>20d</b>${L('last')}</div></div></div>
  <div class="ri-dr-f"><a class="ri-btn ri-btn-gold">${L('profile')}</a></div></aside>`;}
