<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIT — Level & Focus (interactive mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161613;--paper:#f3f0e8;--card:#fbf9f3;--black:#11110f;--black2:#23231f;--white:#f4f1e9;--red:#b64235;--green:#5c6f4a;--amber:#b07a2b;--blue:#4a5f6f;--gold:#a47d43;--muted:#77736a;--line:rgba(22,22,19,.18);--dline:rgba(244,241,233,.2);--display:'Oswald',Impact,sans-serif;--body:'Manrope',Helvetica,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:'Heebo',var(--body)}
[dir=rtl] .mono,[dir=rtl] label,[dir=rtl] th{letter-spacing:0}
button{border:0;color:inherit;font:inherit;cursor:pointer;background:none}input,select,textarea{font:inherit;color:inherit}
.shell{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;background:var(--black);color:var(--white);padding:26px 20px;display:flex;flex-direction:column}
.brand{font:600 14px/1 var(--display);letter-spacing:.08em;padding-bottom:26px;border-bottom:1px solid var(--dline)}.brand b{color:var(--red)}
.cap{margin:28px 0 12px;color:#8e8b82;font:9px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em}
.nav{display:grid;gap:2px}.nav button{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:#b9b5aa;font:11px/1 var(--mono);text-transform:uppercase;text-align:start}
.nav button:hover,.nav button.on{color:var(--white)}.nav button.on span:first-child{border-bottom:1px solid var(--red);padding-bottom:3px}
.nav small{color:#8e8b82}.badge{background:var(--red);color:#fff;border-radius:9px;padding:2px 7px;font:10px/1 var(--mono)}
.rail-foot{margin-top:auto;color:#8e8b82;font:9px/1.5 var(--mono);text-transform:uppercase}
.topbar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 38px;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}.crumb strong{color:var(--ink);font-weight:500}
.tact{display:flex;gap:16px;align-items:center;font:10px/1 var(--mono);text-transform:uppercase}.tact button:hover{color:var(--red)}
.askbtn{border:1px solid var(--ink);padding:9px 14px;display:flex;gap:8px;align-items:center}.askbtn:hover{background:var(--ink);color:var(--white)!important}
.main{padding:34px 38px 80px;max-width:1500px}
h1.big{margin:0 0 6px;font:500 clamp(44px,5.4vw,84px)/.86 var(--display);letter-spacing:-.03em;text-transform:uppercase}h1.big span{color:var(--red)}
.sub{color:var(--muted);font:11px/1.5 var(--mono);text-transform:uppercase;max-width:760px;margin:0 0 30px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mh h2{margin:0;font:500 24px/.95 var(--display);text-transform:uppercase}.mh .m{color:var(--muted);font:10px/1 var(--mono);text-transform:uppercase}
.mod{margin-bottom:44px}
.lnk{color:var(--red);font:10px/1 var(--mono);text-transform:uppercase}.lnk:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--ink)}.seg button{padding:8px 14px;font:10px/1 var(--mono);text-transform:uppercase}.seg button.on{background:var(--ink);color:var(--white)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;font:10px/1.2 var(--mono);text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.chip.fill{color:#fff!important;border-color:transparent}
.dark .chip[style*="#161613"],.dh .chip[style*="#161613"]{color:var(--white)!important}.dark .chip[style*="#161613"] .dot,.dh .chip[style*="#161613"] .dot{background:var(--white)!important}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse}th{padding:14px 8px 10px;color:var(--muted);text-align:start;font:9px/1 var(--mono);font-weight:400;text-transform:uppercase}
td{padding:13px 8px;border-top:1px solid var(--line);font:11px/1.25 var(--mono);vertical-align:middle}td.n{font:700 13px var(--body)}td.n small{display:block;color:var(--muted);font:10px var(--mono);font-weight:400;margin-top:2px}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:rgba(22,22,19,.04)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:46px}
.dark{background:var(--black);color:var(--white);padding:24px 24px 10px}.dark .mh{border-color:var(--dline)}.dark .mh h2{color:var(--white)}.dark .mh .m{color:#aaa69b}
.btn{padding:9px 14px;border:1px solid var(--ink);font:10px/1 var(--mono);text-transform:uppercase}.btn:hover{background:var(--ink);color:var(--white)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:#8f3329}
.btn.ghost-d{border-color:var(--dline);color:var(--white)}.btn.ghost-d:hover{background:var(--white);color:var(--ink)}
.btn.sm{padding:7px 10px}
/* distribution */
.dist{display:flex;height:54px;border:1px solid var(--ink);margin:16px 0 8px}.dist button{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font:500 20px/1 var(--display);transition:flex .3s}.dist button small{font:9px var(--mono);opacity:.85}.dist button:hover{filter:brightness(1.15)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font:10px var(--mono);text-transform:uppercase}
/* focus rows */
.frow{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.ava{width:42px;height:42px;display:grid;place-items:center;background:var(--black);color:var(--white);font:500 15px var(--display);letter-spacing:.04em}
.frow h3{margin:0 0 3px;font:500 20px/1 var(--display);text-transform:uppercase}.frow p{margin:0;color:var(--muted);font:10.5px/1.45 var(--mono)}.frow .why{color:var(--ink);margin-top:5px}
.ai{display:inline-block;background:var(--black);color:var(--gold);font:9px/1 var(--mono);padding:3px 5px;margin-inline-end:6px;letter-spacing:.06em}
.prow{padding:16px 0;border-bottom:1px solid var(--dline)}.prow h3{margin:0 0 4px;font:500 19px/1 var(--display);text-transform:uppercase}.prow p{margin:0 0 10px;color:#b9b5aa;font:10.5px/1.45 var(--mono)}.prow .acts{display:flex;gap:8px}
.bars{display:grid;gap:12px;margin:14px 0 18px}.bar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font:10px var(--mono);text-transform:uppercase}
.track{height:10px;background:rgba(244,241,233,.12);position:relative}.track i{position:absolute;inset:0 auto 0 0;display:block}.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
[dir=rtl] .track i{inset:0 0 0 auto}
.ask{display:flex;border:1px solid var(--ink);margin-top:10px}.ask input{flex:1;border:0;background:transparent;padding:13px 14px;outline:0;font:12px var(--mono)}.ask button{padding:0 16px;background:var(--ink);color:var(--white);font:10px var(--mono);text-transform:uppercase}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sug button{border:1px solid var(--line);padding:6px 9px;font:10px var(--mono);color:var(--muted)}.sug button:hover{border-color:var(--ink);color:var(--ink)}
/* before */
.before{opacity:.95;border:1px dashed var(--red);padding:16px;position:relative}.before::after{content:attr(data-tag);position:absolute;top:-9px;inset-inline-start:12px;background:var(--paper);color:var(--red);padding:0 6px;font:9px var(--mono);text-transform:uppercase}
/* board */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.filters input[type=search]{border:1px solid var(--ink);background:transparent;padding:9px 12px;font:11px var(--mono);min-width:220px;outline:0}
.fbtn{border:1px solid var(--line);padding:7px 10px;font:10px var(--mono);text-transform:uppercase}.fbtn.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.matrix{display:grid;grid-template-columns:130px repeat(4,minmax(0,1fr));border:1px solid var(--ink);margin-bottom:26px;background:var(--card)}
.mx-h{padding:12px 10px;background:var(--black);color:var(--white);font:10px/1.3 var(--mono);text-transform:uppercase}.mx-h b{display:block;font:500 15px var(--display);letter-spacing:.03em}
.mx-r{padding:12px 10px;border-top:1px solid var(--line);font:10px/1.3 var(--mono);text-transform:uppercase;background:var(--card)}.mx-r b{display:block;font:500 17px var(--display)}
.mx-c{border-top:1px solid var(--line);border-inline-start:1px solid var(--line);min-height:82px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;position:relative;cursor:pointer;transition:background .2s}
.mx-c:hover{background:rgba(164,125,67,.1)}.mx-c.sel{outline:2px solid var(--red);outline-offset:-2px;background:rgba(182,66,53,.07)}
.mx-c .ct{position:absolute;top:4px;inset-inline-end:7px;color:var(--muted);font:10px var(--mono)}
.pill{width:30px;height:30px;display:grid;place-items:center;font:500 11px var(--display);color:#fff;position:relative}.pill.sg::after{content:'';position:absolute;top:-3px;inset-inline-end:-3px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:1.5px solid var(--card)}
.urg{display:inline-block;width:64px;height:6px;background:var(--line);vertical-align:middle}.urg i{display:block;height:100%}
.arrow.up{color:var(--green)}.arrow.down{color:var(--red)}.arrow.flat{color:var(--muted)}
.bulk{position:sticky;bottom:14px;margin-top:14px;background:var(--black);color:var(--white);padding:12px 16px;display:none;gap:12px;align-items:center;font:10px var(--mono);text-transform:uppercase;z-index:5}.bulk.show{display:flex}
.bulk select{background:transparent;color:var(--white);border:1px solid var(--dline);padding:6px;font:10px var(--mono)}.bulk option{color:#000}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(17,17,15,.6);z-index:30;display:none}.ov.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--paper);z-index:31;overflow:auto;transform:translateX(105%);transition:transform .3s;border-inline-start:4px solid var(--red)}
[dir=rtl] .drawer{transform:translateX(-105%)}.drawer.open{transform:none!important}
.dh{background:var(--black);color:var(--white);padding:26px 28px 22px}.dh h2{margin:6px 0 4px;font:500 40px/.9 var(--display);text-transform:uppercase}.dh p{margin:0;color:#b9b5aa;font:11px var(--mono);text-transform:uppercase}
.x{float:inset-inline-end;font:22px var(--display);color:var(--white)}
.dsec{padding:20px 28px;border-bottom:1px solid var(--line)}.dsec h4{margin:0 0 12px;color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ladder button{border:1px solid var(--line);padding:10px 4px 9px;text-align:center;position:relative;background:var(--card)}
.ladder button b{display:block;font:500 20px var(--display)}.ladder button small{font:9px var(--mono);text-transform:uppercase;color:var(--muted)}
.ladder button.cur{color:#fff;border-color:transparent}.ladder button.cur small{color:rgba(255,255,255,.85)}
.ladder button.aim::after{content:'AI';position:absolute;top:-8px;inset-inline-start:50%;transform:translateX(-50%);background:var(--black);color:var(--gold);font:9px var(--mono);padding:2px 5px}
.fseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.fseg button{border:1px solid var(--line);padding:10px 4px;font:10px var(--mono);text-transform:uppercase;background:var(--card);position:relative}.fseg button.cur{color:#fff;border-color:transparent}
.fseg button.aim::after{content:'AI';position:absolute;top:-8px;inset-inline-start:50%;transform:translateX(-50%);background:var(--black);color:var(--gold);font:9px var(--mono);padding:2px 5px}
.fac{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font:10px var(--mono);text-transform:uppercase}.fac .tr{height:8px;background:var(--line)}.fac .tr i{display:block;height:100%;background:var(--ink)}
.aibox{background:var(--black);color:var(--white);padding:18px 20px;font:12px/1.65 var(--body);position:relative}.aibox .t{color:var(--gold);font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.cur-blink::after{content:'▍';animation:bl 1s steps(2) infinite;color:var(--gold)}@keyframes bl{50%{opacity:0}}
.ev{display:grid;gap:6px;margin-top:14px}.ev div{font:10.5px/1.4 var(--mono);color:#cbc6b9;padding-inline-start:12px;border-inline-start:2px solid var(--gold)}
.tl{border-inline-start:1px solid var(--ink);margin-inline-start:5px}.tl div{padding:0 0 14px 14px;position:relative;font:10.5px/1.45 var(--mono)}[dir=rtl] .tl div{padding:0 14px 14px 0}
.tl div::before{content:'';position:absolute;inset-inline-start:-4px;top:5px;width:7px;height:7px;background:var(--red);border-radius:50%}.tl b{font-family:var(--body)}
.drawer textarea{width:100%;border:1px solid var(--ink);background:var(--card);padding:10px;font:11px var(--mono);min-height:62px;resize:vertical}
.peers{display:flex;gap:6px;flex-wrap:wrap}
/* triage */
.tcard{display:grid;grid-template-columns:1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.tcard h3{margin:0;font:500 26px/1 var(--display);text-transform:uppercase}.tcard .mv{display:flex;align-items:center;gap:10px;margin:10px 0}
.conf{display:inline-block;width:90px;height:6px;background:var(--line);vertical-align:middle;margin-inline:6px}.conf i{display:block;height:100%;background:var(--green)}
.tcard p{margin:6px 0 0;font:11.5px/1.55 var(--body);max-width:640px}.tcard .ac{display:flex;flex-direction:column;gap:8px;min-width:130px}
.empty{padding:60px 0;text-align:center;color:var(--muted);font:12px var(--mono);text-transform:uppercase}
/* engine */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--ink);margin:18px 0 22px}
.stg{padding:18px;border-inline-end:1px solid var(--line);background:var(--card);min-height:200px;position:relative}.stg:last-child{border:0}
.stg small{color:var(--muted);font:9px var(--mono);text-transform:uppercase}.stg h3{margin:6px 0 10px;font:500 20px/1 var(--display);text-transform:uppercase}.stg .num{font:500 38px/1 var(--display)}.stg p{font:10.5px/1.5 var(--mono);color:var(--muted)}
.stg .pg{position:absolute;bottom:0;inset-inline:0;height:4px;background:var(--line)}.stg .pg i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}.stg.done{background:#eef0e6}.stg.done .pg i{background:var(--green)}
.cost{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cost div{border:1px solid var(--line);padding:14px;background:var(--card)}.cost b{display:block;font:500 28px var(--display)}.cost small{font:9px var(--mono);text-transform:uppercase;color:var(--muted)}
/* calib */
.cal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:46px}
.sl{display:grid;grid-template-columns:120px 1fr 44px;gap:12px;align-items:center;margin:14px 0;font:10px var(--mono);text-transform:uppercase}.sl input{accent-color:var(--red);width:100%}
.imp{border:1px solid var(--ink);background:var(--card);padding:14px;margin-top:12px;font:11px/1.6 var(--mono)}.imp b{font:500 30px var(--display)}
/* ask */
.askov{position:fixed;inset:0;background:rgba(17,17,15,.72);z-index:40;display:none;place-items:start center;padding-top:9vh}.askov.open{display:grid}
.askm{width:min(760px,94%);background:var(--paper);border-top:4px solid var(--red);max-height:80vh;overflow:auto}
.askm .in{display:flex;border-bottom:1px solid var(--line)}.askm .in input{flex:1;border:0;background:transparent;padding:20px;font:16px var(--body);outline:0}
.askm .res{padding:6px 22px 22px}.askm .ans{background:var(--black);color:var(--white);padding:16px 18px;margin:16px 0;font:12.5px/1.65 var(--body)}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;min-width:240px;padding:15px 18px;background:var(--black);color:var(--white);border-left:3px solid var(--red);font:11px/1.35 var(--mono);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}
@media(max-width:1100px){.shell{grid-template-columns:64px 1fr}.rail span,.rail .cap,.rail-foot,.nav small,.brand span{display:none}.grid2,.cal{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}.cost{grid-template-columns:1fr 1fr}.main,.topbar{padding-inline:20px}.matrix{grid-template-columns:90px repeat(4,1fr);font-size:9px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>BRIT</b><span> / SPORT GROUP</span></div>
    <p class="cap" data-t="room"></p>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">Mock · sample data<br>Men platform</div>
  </aside>
  <div>
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="tact">
        <button class="askbtn" onclick="openAsk()">✦ <span data-t="askAi"></span> <span style="opacity:.5">/</span></button>
        <button onclick="toggleLang()" id="langbtn">HE / EN</button>
        <span>TLV 14:45</span>
      </div>
    </header>
    <main class="main" id="view"></main>
  </div>
</div>

<div class="ov" id="ov" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="askov" id="askov" onclick="if(event.target===this)closeAsk()"><div class="askm">
  <div class="in"><span style="padding:20px 0 0 20px;color:var(--gold);font-size:20px">✦</span><input id="askin" placeholder="" onkeydown="if(event.key==='Enter')runAsk(this.value)"></div>
  <div class="res" id="askres"></div>
</div></div>
<div class="toast" id="toast"></div>

/* ============ engine maths ============ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function score(p){const s=Object.values(W).reduce((a,b)=>a+b,0)||1;return p.f.reduce((a,v,i)=>a+v*Object.values(W)[i],0)/s}
function lvOf(s){return s>=TH[1]?1:s>=TH[2]?2:s>=TH[3]?3:s>=TH[4]?4:5}
function baseLv(p){return lvOf(score(p))}
function aiLv(p){return clamp(baseLv(p)-p.adj,1,5)}
const LW={1:1,2:.85,3:.6,4:.35,5:.3};
function urgency(p){
  const time=Math.max(p.c<=4?95:p.c<=7?80:p.c<=12?55:20,p.m!=null?(p.m<=7?100:p.m<=30?75:p.m<=60?40:0):0);
  const dem=Math.min(100,p.d*30), gap=Math.min(100,p.t*3), mom=p.tr==='up'?80:p.tr==='down'?30:50;
  return Math.round(.38*time+.27*dem+.17*gap+.18*mom);
}
function aiFocus(p){const v=urgency(p)*.7+LW[aiLv(p)]*100*.3;return v>=62?1:v>=50?2:v>=39?3:4}
function sugg(p){return !dismissed.has(p.id)&&!locked.has(p.id)&&(aiLv(p)!==p.lv||aiFocus(p)!==p.fc)}
const sevScore=p=>Math.abs(aiLv(p)-p.lv)*2+Math.abs(aiFocus(p)-p.fc);

function filtered(){

    if(bf.q&&!(p.n+' '+p.club).toLowerCase().includes(bf.q.toLowerCase()))return false;
    if(bf.lv&&p.lv!==bf.lv)return false;
    if(bf.fc&&p.fc!==bf.fc)return false;
    if(bf.untouched&&p.t<14)return false;
    if(bf.aidiff&&!(aiLv(p)!==p.lv||aiFocus(p)!==p.fc))return false;

    <div class="mh"><h2>${T('wts')}</h2><span class="m" id="wsum"></span></div>
    <div style="margin:10px 0 0"><span style="font:10px var(--mono);color:var(--muted)">${lang==='en'?'PRESET':'תבנית'}</span>
      <select id="preset" onchange="preset(this.value)" style="margin-inline-start:8px;border:1px solid var(--ink);background:transparent;padding:6px;font:10px var(--mono)"><option value="def">Default</option><option value="fw">Forwards — output-heavy</option><option value="gk">Goalkeepers — form-heavy</option><option value="yo">Youth — potential-heavy</option></select></div>
    ${keys.map(k=>`<div class="sl"><span>${T(k)}</span><input type="range" min="0" max="50" value="${W[k]}" oninput="W['${k}']=+this.value;calUpd()"><span id="w_${k}">${W[k]}</span></div>`).join('')}
    <div class="mh" style="margin-top:30px"><h2>${T('thr')}</h2></div>
    ${[1,2,3,4].map(l=>`<div class="sl"><span>L${l} ${T('L'+l)}</span><input type="range" min="20" max="95" value="${TH[l]}" oninput="TH[${l}]=+this.value;calUpd()"><span id="t_${l}">${TH[l]}</span></div>`).join('')}
    <div style="display:flex;gap:10px;margin-top:20px"><button class="btn red" onclick="calSave()">${T('save')}</button><button class="btn" onclick="Object.assign(W,W0);Object.assign(TH,TH0);document.getElementById('preset').value='def';vCalib()">${T('reset')}</button></div>
  </div><div>
    <div class="mh"><h2>${T('impact')}</h2></div><div id="impact"></div></div></div>`;
  calUpd();
}
function preset(v){const m={def:[30,25,20,10,15],fw:[45,15,15,10,15],gk:[25,20,15,10,30],yo:[15,45,10,10,20]}[v];['perf','fm','val','lg','form'].forEach((k,i)=>W[k]=m[i]);vCalib();document.getElementById('preset').value=v}
function calUpd(){
  ['perf','fm','val','lg','form'].forEach(k=>{const e=document.getElementById('w_'+k);if(e)e.textContent=W[k]});[1,2,3,4].forEach(l=>{const e=document.getElementById('t_'+l);if(e)e.textContent=TH[l]});
  const sum=Object.values(W).reduce((a,b)=>a+b,0);const ws=document.getElementById('wsum');if(ws)ws.textContent=lang==='en'?`normalised from ${sum}`:`מנורמל מתוך ${sum}`;
  const ch=P.filter(p=>aiLv(p)!==calSnapshot.find(s=>s.id===p.id).l);
  document.getElementById('impact').innerHTML=`<div class="imp"><b>${ch.length}</b> ${lang==='en'?'of 16 players change AI level vs. the current calibration':'מתוך 16 שחקנים משנים רמת AI לעומת הכיול הנוכחי'}</div>
  ${ch.map(p=>{const o=calSnapshot.find(s=>s.id===p.id).l,n=aiLv(p);return `<div class="frow" style="grid-template-columns:1fr auto;padding:10px 0"><div><h3 style="font-size:17px">${p.n}</h3><p>${p.pos} · ${p.club}</p></div><div>${lvChip(o,false)} → ${lvChip(n)}</div></div>`}).join('')}
  <div class="imp" style="margin-top:20px">${[1,2,3,4,5].map(l=>`<div style="display:grid;grid-template-columns:80px 1fr 30px;gap:8px;align-items:center;margin:4px 0"><span>L${l}</span><div class="urg" style="width:100%"><i style="width:${P.filter(p=>aiLv(p)===l).length/16*100}%;background:${LC[l]}"></i></div><span>${P.filter(p=>aiLv(p)===l).length}</span></div>`).join('')}</div>`;
}
function calSave(){calSnapshot=P.map(p=>({id:p.id,l:aiLv(p)}));toast(T('signedOff')+' · '+(lang==='en'?'inbox will refresh':'התיבה תתרענן'));renderNav();calUpd()}

/* ============ ASK AI ============ */
function openAsk(q){document.getElementById('askov').classList.add('open');const i=document.getElementById('askin');i.value=q||'';i.focus();document.getElementById('askres').innerHTML=q?'':sampleQs().map(x=>`<div class="sug"><button onclick="runAsk('${x.replace(/'/g,"\\'")}')">${x}</button></div>`).join('');if(q)runAsk(q)}
function closeAsk(){document.getElementById('askov').classList.remove('open')}
function runAsk(q){
  document.getElementById('askin').value=q;const s=q.toLowerCase();let res=P.slice(),why=[];
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has('push','this week','לדחוף','השבוע')){res=res.filter(p=>aiFocus(p)===1||p.fc===1);why.push(lang==='en'?'Focus = Push now':'פוקוס = לדחוף עכשיו')}
  if(has('expir','6 month','contract','נגמר','חוזה')){res=res.filter(p=>p.c<=6);why.push(lang==='en'?'contract ≤ 6 months':'חוזה ≤ 6 חודשים')}
  if(has('core','ליבה')){res=res.filter(p=>p.lv===3);why.push('L3 Core')}
  if(has('premium','פרימיום')){res=res.filter(p=>p.lv===2);why.push('L2 Premium')}
  if(has('elite','עילית')){res=res.filter(p=>p.lv===1);why.push('L1 Elite')}
  if(has('drift','down','ירידה','בירידה')){res=res.filter(p=>p.tr==='down'||aiLv(p)>p.lv);why.push(lang==='en'?'trending down / AI lower':'מגמת ירידה / AI נמוך יותר')}
  if(has('untouched','ללא קשר','לא נגעת')){res=res.filter(p=>p.t>=14);why.push(lang==='en'?'no contact 14d+':'ללא קשר 14+ ימים')}
  if(!why.length){res=res.filter(p=>sugg(p));why.push(lang==='en'?'pending AI suggestions':'הצעות AI ממתינות')}
  res.sort((a,b)=>urgency(b)-urgency(a));
  const ans=lang==='en'?`${res.length} match${res.length===1?'':'es'} (${why.join(' + ')}). ${res[0]?`Highest urgency: <b>${res[0].n}</b> — ${R(res[0]).split('.')[0]}.`:'Nothing matches right now.'}`
    :`${res.length} תוצאות (${why.join(' + ')}). ${res[0]?`הדחיפות הגבוהה ביותר: <b>${res[0].n}</b> — ${R(res[0]).split('.')[0]}.`:'אין התאמות כרגע.'}`;
  document.getElementById('askres').innerHTML=`<div class="ans"><span class="ai">AI</span>${ans}</div>
  <table><tbody>${res.slice(0,8).map(p=>`<tr class="row" onclick="closeAsk();openDrawer(${p.id})"><td class="n">${p.n}<small>${p.pos} · ${p.club}</small></td><td>${lvChip(p.lv)}</td><td>${fcChip(p.fc)}</td><td>${p.c}${T('months')}</td></tr>`).join('')}</tbody></table>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openAsk()}
  if(e.key==='Escape'){closeAsk();closeDrawer()}
});
render();
</script>
</body>
</html>
