<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIT — Dashboard · Roster intelligence (Level & Focus)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens + shell copied from mgsr-web globals.css (.brit-room) so this mock matches production */
.brit-room{--ink:#161613;--black:#11110f;--paper:#f3f0e8;--paper-2:#e4ded1;--card:#fbf9f3;--gold:#a47d43;--gold-soft:#c9a66b;--red:#b64235;--green:#5c6f4a;--amber:#b07a2b;--blue:#4a5f6f;--muted:#77736a;--muted-2:#aba69b;--line:rgba(22,22,19,.18);--line-2:rgba(22,22,19,.07);--dark-line:rgba(243,240,232,.2);--display:'Oswald',Impact,sans-serif;--body:'Manrope',Helvetica,sans-serif;--mono:'DM Mono',monospace;min-height:100vh;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.brit-room[dir=rtl]{--display:'Heebo',sans-serif;--body:'Heebo',sans-serif;--mono:'Heebo',sans-serif}
.brit-room *,.brit-room *::before,.brit-room *::after{box-sizing:border-box}
body{margin:0;background:var(--paper)}
.brit-room::before{content:'';position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
.brit-room a{color:inherit;text-decoration:none}.brit-room button{border:0;color:inherit;font:inherit;cursor:pointer;background:transparent}
.brit-app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.brit-rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:25px 22px;background:var(--black);color:var(--paper)}
.brit-lockup{display:flex;align-items:center;gap:12px;padding-bottom:25px;border-bottom:1px solid var(--dark-line)}
.brit-lockup .lg{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-soft);display:grid;place-items:center;color:var(--gold-soft);font:600 15px var(--display)}
.brit-lockup strong{display:block;font:600 15px/1 var(--display);letter-spacing:.08em}.brit-lockup small{display:block;margin-top:5px;color:#aaa59b;font:9px/1 var(--mono);text-transform:uppercase}
.brit-nav{display:grid;gap:3px;margin-top:28px}.brit-nav a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase;cursor:pointer}
.brit-nav a:hover,.brit-nav a.active{color:var(--gold-soft)}.brit-nav a.active::before{content:'';width:20px;height:1px;margin-inline-end:-20px;background:var(--gold-soft)}
.brit-nav em{color:var(--gold-soft);font-style:normal}
.brit-rail-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--dark-line);color:#979289;font:9px/1.6 var(--mono);text-transform:uppercase}.brit-rail-footer strong{display:block;color:var(--paper);font-weight:400}
.brit-topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 43px;background:var(--black);color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase}
.brit-topbar strong{color:var(--paper);font-weight:400}.brit-actions{display:flex;align-items:center;gap:19px}.brit-actions button{color:#aaa69c;font:10px/1 var(--mono);text-transform:uppercase}.brit-actions button:hover{color:var(--gold-soft)}
.brit-avatar{width:28px;height:28px;display:grid;place-items:center;background:var(--gold-soft);color:var(--ink);font:11px/1 var(--display)}
.brit-ps{display:inline-flex;padding:3px;border:1px solid var(--dark-line);border-radius:999px;position:relative}.brit-ps span{padding:7px 16px;border-radius:999px;font:600 11px/1 var(--display);letter-spacing:.07em;color:#8e8b82}.brit-ps span.on{background:var(--gold-soft);color:var(--ink)}
.brit-canvas{max-width:1540px;padding:43px}
.brit-kicker{margin:0 0 18px;color:var(--gold);font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.brit-masthead{margin-bottom:49px}.brit-masthead h1{margin:0;font:500 clamp(56px,7vw,104px)/.78 var(--display);letter-spacing:-.045em;text-transform:uppercase}.brit-masthead h1 span{color:var(--gold)}
.brit-room[dir=rtl] .brit-masthead h1{letter-spacing:normal;font-weight:800;line-height:.95}
.brit-signals{display:grid;grid-template-columns:2fr repeat(2,1fr);margin-bottom:59px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.brit-signal{min-height:116px;padding:18px 20px 20px 0;border-inline-end:1px solid var(--line)}.brit-signal:not(:first-child){padding-inline-start:20px}.brit-signal:last-child{border-inline-end:0}
.brit-signal label{display:block;color:var(--muted);font:9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brit-signal strong{display:block;margin-top:14px;font:500 clamp(30px,3.6vw,50px)/.8 var(--display);text-transform:uppercase}.brit-signal .brit-red{color:var(--red)}
.brit-signal small{display:block;margin-top:10px;color:var(--muted);font:9px/1 var(--mono)}
.brit-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(300px,.78fr);gap:56px}
.brit-module{margin-bottom:56px}
.brit-module-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.brit-module-head h2{margin:0;font:500 27px/.9 var(--display);text-transform:uppercase}.brit-room[dir=rtl] .brit-module-head h2{font-weight:800;letter-spacing:normal}
.brit-module-head span,.brit-module-head a,.brit-module-head button{color:var(--muted);font:9px/1 var(--mono);text-transform:uppercase}.brit-module-head a:hover,.brit-module-head button:hover{color:var(--gold)}
.brit-heading-gold{color:var(--gold)}
.brit-deadline{display:grid;grid-template-columns:57px 1fr auto;gap:18px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}
.brit-deadline .brit-code{color:var(--gold);font:10px/1 var(--mono)}.brit-deadline h3{margin:0 0 4px;font:500 24px/.9 var(--display);text-transform:uppercase}
.brit-deadline p{margin:0;color:var(--muted);font:9px/1.4 var(--mono);text-transform:uppercase}.brit-deadline time{color:var(--gold);text-align:end;font:500 18px/.9 var(--display);text-transform:uppercase}.brit-deadline time.brit-red{color:var(--red)}
.brit-birthday-btn{padding:8px 10px;background:var(--gold-soft);color:var(--ink);font:9px/1 var(--mono);text-transform:uppercase;margin-inline-end:12px}.brit-birthday-btn:hover{background:var(--gold);color:var(--paper)}
.brit-black-module{padding:25px 26px 8px;background:var(--black);color:var(--paper)}.brit-black-module .brit-module-head{border-color:var(--dark-line)}.brit-black-module .brit-module-head h2{color:var(--paper)}.brit-black-module .brit-module-head span{color:#aaa69c}
.brit-approval{display:grid;grid-template-columns:48px 1fr auto;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid var(--dark-line)}
.brit-avatar-box{width:48px;height:58px;display:grid;place-items:center;background:rgba(243,240,232,.08);color:#aaa69c;font:500 18px/1 var(--display)}
.brit-approval h3{margin:0 0 4px;font:500 22px/.9 var(--display);text-transform:uppercase}.brit-approval p{margin:0;color:#aaa69c;font:9px/1.4 var(--mono);text-transform:uppercase}
.brit-approve-btn{padding:9px 10px;background:var(--gold-soft);color:var(--ink);font:9px/1 var(--mono);text-transform:uppercase}
.brit-mandates{display:grid;grid-template-columns:repeat(3,1fr)}.brit-mandate{padding:18px 16px 20px 0;border-bottom:1px solid var(--line)}.brit-mandate:not(:first-child){padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.brit-mandate strong{display:block;margin-bottom:7px;font:500 23px/.9 var(--display);text-transform:uppercase}.brit-mandate span{color:var(--red);font:9px/1 var(--mono);text-transform:uppercase}
.brit-mandate p{min-height:30px;margin:10px 0 14px;color:var(--muted);font:9px/1.4 var(--mono)}.brit-mandate a{padding:0 0 4px;border-bottom:1px solid var(--ink);font:9px/1 var(--mono);text-transform:uppercase;cursor:pointer}
.brit-feed-row{display:grid;grid-template-columns:70px 1fr auto;gap:18px;padding:15px 0;border-top:1px solid var(--line);align-items:start}.brit-feed-row time{color:var(--muted);font:9px/1 var(--mono)}.brit-feed-row p{margin:0;font-size:11px}.brit-feed-row p strong{display:block;margin-top:3px}.brit-feed-row span{color:var(--gold);font:9px/1 var(--mono);text-transform:uppercase;white-space:nowrap}
.brit-new-request{display:block;width:100%;margin-top:18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--gold);font:9px/1 var(--mono);text-transform:uppercase}
.brit-focus{display:grid;grid-template-columns:1fr 1fr;gap:16px}.brit-focus article{position:relative;min-height:190px;overflow:hidden;background:linear-gradient(160deg,#23231f,#11110f)}
.brit-focus article::after{content:'';position:absolute;inset:52% 0 0;background:rgba(17,17,15,.76)}.brit-focus-copy{position:absolute;inset-inline:16px;bottom:16px;z-index:1;color:var(--paper)}
.brit-focus-copy small{display:block;color:var(--gold-soft);font:9px/1 var(--mono);text-transform:uppercase}.brit-focus-copy h3{margin:6px 0 0;font:500 24px/.9 var(--display);text-transform:uppercase}
.brit-empty{padding:22px 0;color:var(--muted);font:9px/1.4 var(--mono);text-transform:uppercase}

/* ============ NEW: Roster intelligence (Level & Focus) ============ */
.ri-bar{display:flex;height:34px;margin:20px 0 9px;border:1px solid var(--ink)}
.ri-bar button{display:flex;align-items:center;justify-content:center;font:500 15px/1 var(--display);transition:flex .35s,opacity .2s,filter .2s;min-width:0;overflow:hidden}
.ri-bar button:hover{filter:brightness(1.12)}.ri-bar.dim button:not(.sel){opacity:.35}
.ri-key{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ri-key button{text-align:start;font:9px/1.35 var(--mono);color:var(--muted);text-transform:uppercase;padding:0}.ri-key button b{display:block;color:var(--ink);font-weight:500}.ri-key button:hover b,.ri-key button.sel b{color:var(--gold)}
.ri-call{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:22px 0 4px;padding:14px 16px;border:1px solid var(--gold-soft);background:color-mix(in srgb,var(--gold-soft) 8%,transparent)}
.ri-call .gi{width:32px;height:32px;display:grid;place-items:center;background:var(--gold-soft);color:var(--ink);font:12px/1 var(--display)}
.ri-call b{display:block;font:500 15px/1.1 var(--display);text-transform:uppercase}.ri-call small{display:block;margin-top:3px;color:var(--gold);font:9px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.ri-call button{padding:9px 11px;background:var(--ink);color:var(--paper);font:9px/1 var(--mono);text-transform:uppercase}.ri-call button:hover{background:var(--gold)}
.ri-tabs{display:flex;gap:18px;margin-top:22px;border-bottom:1px solid var(--line-2)}
.ri-tabs button{padding:0 0 9px;color:var(--muted);font:9px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid transparent;margin-bottom:-1px}
.ri-tabs button.on{color:var(--ink);border-color:var(--gold)}.ri-tabs button i{font-style:normal;color:var(--gold);margin-inline-start:4px}
.ri-table{width:100%;border-collapse:collapse}.ri-table th{padding:13px 0 9px;color:var(--muted);text-align:start;font:9px/1 var(--mono);font-weight:400;text-transform:uppercase}
.ri-table td{padding:13px 0;border-top:1px solid var(--line);font:10px/1.25 var(--mono);vertical-align:middle}
.ri-table tbody tr{cursor:pointer;transition:background .2s}.ri-table tbody tr:hover{background:rgba(164,125,67,.07)}
.ri-table td.pl{font-family:var(--body);font-weight:700;font-size:12.5px;padding-inline-end:6px}.ri-table td.pl small{display:block;margin-top:3px;color:var(--muted);font:9px/1.2 var(--mono);font-weight:400;text-transform:uppercase}
.ri-table td.nx{text-align:end;color:var(--muted);white-space:nowrap}.ri-table td.nx.hot{color:var(--red)}
.ri-table tr.flash{animation:fl 2.4s}@keyframes fl{0%,40%{background:rgba(182,66,53,.18)}100%{background:transparent}}
.lv{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lv b{min-width:26px;height:20px;display:inline-grid;place-items:center;font:500 11px/1 var(--display);letter-spacing:.03em}
.lv i{font-style:normal;font-size:8px}.lv .up{color:var(--green)}.lv .down{color:var(--red)}.lv .flat{color:var(--muted-2)}
.lv.sg b{outline:1.5px dashed var(--gold);outline-offset:2px}
.fc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-transform:uppercase;font:10px/1 var(--mono)}.fc s{width:7px;height:7px;border-radius:50%;display:inline-block;text-decoration:none}
.ri-more{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:9px/1 var(--mono);text-transform:uppercase}.ri-more button{color:var(--gold);font:9px/1 var(--mono);text-transform:uppercase}
.ri-eff{margin-top:20px}.ri-eff .row{display:flex;justify-content:space-between;color:var(--muted);font:9px/1 var(--mono);text-transform:uppercase}.ri-eff .row b{color:var(--ink);font-weight:500}
.ri-eff .tr{position:relative;height:6px;background:var(--paper-2);margin:9px 0 8px}.ri-eff .tr i{position:absolute;inset:0 auto 0 0;background:var(--red)}.ri-eff .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.brit-room[dir=rtl] .ri-eff .tr i{inset:0 0 0 auto}.ri-eff p{margin:0;color:var(--muted);font:9px/1.5 var(--mono)}.ri-eff p a{color:var(--gold);cursor:pointer;border-bottom:1px solid var(--gold)}

/* drawer + modal (same vocabulary as .brit-backdrop/.brit-modal) */
.brit-backdrop{position:fixed;inset:0;z-index:70;background:rgba(17,17,15,.66);display:none}.brit-backdrop.open{display:block}
.brit-drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:71;width:min(560px,100%);overflow:auto;background:var(--paper);transform:translateX(105%);transition:transform .32s;border-inline-start:4px solid var(--gold)}
.brit-room[dir=rtl] .brit-drawer{transform:translateX(-105%)}.brit-drawer.open{transform:none!important}
.dr-h{background:var(--black);color:var(--paper);padding:26px 28px 22px}.dr-h .x{float:inset-inline-end;font:22px var(--display);color:var(--paper)}
.dr-h small{color:#aaa69c;font:9px/1 var(--mono);text-transform:uppercase}.dr-h h2{margin:8px 0 12px;font:500 42px/.9 var(--display);text-transform:uppercase}.dr-h .tags{display:flex;gap:8px;flex-wrap:wrap}
.dr-s{padding:20px 28px;border-bottom:1px solid var(--line)}.dr-s h4{margin:0 0 12px;display:flex;justify-content:space-between;color:var(--muted);font:9px/1 var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.08em}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ladder button{position:relative;padding:10px 2px 9px;text-align:center;border:1px solid var(--line);background:var(--card)}.ladder b{display:block;font:500 19px/1 var(--display)}.ladder small{font:8px/1 var(--mono);text-transform:uppercase;color:var(--muted)}
.ladder button.cur{border-color:transparent}.ladder button.cur small{color:inherit;opacity:.8}.ladder button.aim::after,.fseg button.aim::after{content:'AI';position:absolute;top:-8px;inset-inline-start:50%;transform:translateX(-50%);background:var(--black);color:var(--gold-soft);font:8px/1 var(--mono);padding:3px 5px}
.fseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.fseg button{position:relative;padding:11px 2px;border:1px solid var(--line);background:var(--card);font:9px/1 var(--mono);text-transform:uppercase}.fseg button.cur{color:#fff;border-color:transparent}
.aibox{background:var(--black);color:var(--paper);padding:18px 20px;font:12px/1.65 var(--body)}.aibox .t{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--gold-soft);font:9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}.aibox .t button{color:var(--gold-soft);font:9px/1 var(--mono)}
.aibox .ev{margin-top:12px;display:grid;gap:5px}.aibox .ev div{padding-inline-start:10px;border-inline-start:2px solid var(--gold);color:#cbc6b9;font:10px/1.4 var(--mono)}
.sigrow{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font:9px var(--mono);text-transform:uppercase}.sigrow .tr{height:6px;background:var(--paper-2)}.sigrow .tr i{display:block;height:100%;background:var(--ink)}
.touch{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.touch div{padding:10px;border:1px solid var(--line);background:var(--card);font:9px var(--mono);text-transform:uppercase;color:var(--muted)}.touch b{display:block;color:var(--ink);font:500 22px var(--display)}
.tl{border-inline-start:1px solid var(--ink);margin-inline-start:4px}.tl div{position:relative;padding:0 0 13px 14px;font:10px/1.5 var(--mono);color:var(--muted)}.brit-room[dir=rtl] .tl div{padding:0 14px 13px 0}.tl div::before{content:'';position:absolute;inset-inline-start:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}.tl b{color:var(--ink);font-family:var(--body)}
.dr-s textarea{width:100%;min-height:54px;padding:10px;border:1px solid var(--ink);background:var(--card);font:11px var(--mono)}
.dr-f{padding:18px 28px;display:flex;gap:10px}.btn{padding:11px 14px;font:9px/1 var(--mono);text-transform:uppercase;border:1px solid var(--ink)}.btn:hover{background:var(--ink);color:var(--paper)}.btn.gold{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--ink)}.btn.gold:hover{background:var(--gold);color:var(--paper)}
.brit-modal{position:fixed;z-index:72;top:50%;left:50%;transform:translate(-50%,-48%);width:min(680px,94%);max-height:86vh;overflow:auto;background:var(--paper);border-top:4px solid var(--gold);padding:30px;opacity:0;pointer-events:none;transition:.25s}
.brit-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.brit-modal h2{margin:0 0 4px;font:500 40px/.9 var(--display);text-transform:uppercase}.brit-modal .sub{margin:0 0 10px;color:var(--muted);font:10px/1.5 var(--mono);text-transform:uppercase}
.brit-modal .close{float:inset-inline-end;font:22px var(--display)}
.sg-row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 0;border-top:1px solid var(--line)}.sg-row h3{margin:0 0 6px;font:500 22px/.95 var(--display);text-transform:uppercase}.sg-row .mv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-row p{margin:8px 0 0;font:11px/1.55 var(--body);color:#3b3a35}.sg-row .ac{display:flex;flex-direction:column;gap:6px}.ai{display:inline-block;margin-inline-end:6px;padding:3px 5px;background:var(--black);color:var(--gold-soft);font:8px/1 var(--mono);letter-spacing:.06em}
.conf{font:9px var(--mono);color:var(--muted);text-transform:uppercase}
/* push notification */
.notif{position:fixed;top:92px;inset-inline-end:24px;z-index:90;width:360px;background:var(--black);color:var(--paper);border-inline-start:3px solid var(--red);padding:16px 18px;transform:translateX(130%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.brit-room[dir=rtl] .notif{transform:translateX(-130%)}.notif.show{transform:none!important}
.notif small{display:flex;justify-content:space-between;color:var(--gold-soft);font:8px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em}.notif b{display:block;margin:8px 0 4px;font:500 20px/1 var(--display);text-transform:uppercase}.notif p{margin:0;color:#b9b5aa;font:10px/1.5 var(--mono)}.notif button{margin-top:10px;color:var(--gold-soft);font:9px var(--mono);text-transform:uppercase;border-bottom:1px solid var(--gold-soft)}
.toast{position:fixed;left:24px;bottom:70px;z-index:90;padding:13px 16px;background:var(--black);color:var(--paper);border-left:3px solid var(--gold);font:10px/1.4 var(--mono);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}
.mockbar{position:fixed;left:0;right:0;bottom:0;z-index:95;display:flex;gap:10px;align-items:center;padding:9px 14px;background:#fff;border-top:2px dashed var(--gold);font:10px/1 var(--mono);text-transform:uppercase}
.mockbar b{color:var(--gold)}.mockbar button{padding:7px 10px;border:1px solid var(--ink)}.mockbar button:hover{background:var(--ink);color:#fff}.mockbar span{color:var(--muted)}
.brit-canvas{padding-bottom:90px}
@media(max-width:1100px){.brit-app{grid-template-columns:1fr}.brit-rail{display:none}.brit-grid{grid-template-columns:1fr}.brit-canvas{padding:24px}.brit-topbar{padding:0 20px}.brit-signals{grid-template-columns:1fr}.brit-signal{border:0;padding-inline-start:0!important}}
</style>
</head>
<body>

   <p>${T('effMsg').replace('{n}',gaps||3)} <a onclick="setTab('priority')">${T('effLink')}</a><br>${T('effNote')}.</p></div>`;
}
const setLv=l=>{lvFilter=lvFilter===l?0:l;if(tab==='changes')tab='all';paint()};
const setTab=t=>{tab=t;showAll=false;paint()};

/* ---- page ---- */
function pageHTML(){
  const he=lang==='he';
  return `
  <header class="brit-masthead"><p class="brit-kicker">${T('kicker')}</p><h1>${T('hi')}<br><span>${he?'ליאור.':'Lior.'}</span></h1></header>
  <section class="brit-signals"><div class="brit-signal"><label>${T('sig1')}</label><strong>€48.55M</strong><small>${T('sig1n')}</small></div><div class="brit-signal"><label>${T('sig2')}</label><strong>16</strong><small>${T('sig2n')}</small></div><div class="brit-signal"><label>${T('sig3')}</label><strong class="brit-red">03</strong><small>${T('sig3n')}</small></div></section>
  <div class="brit-grid">
   <div>
    <section class="brit-module"><div class="brit-module-head"><h2>${T('bday')}</h2><span>${T('bdayN')}</span></div>
      <div class="brit-deadline"><div class="brit-code">${he?'היום':'Today'}</div><div><h3>Yonatan Peretz</h3><p>Maccabi Tel Aviv U21 / ${he?'חוגג 20':'Turns 20'}</p></div><div><button class="brit-birthday-btn">${he?'שלח ברכה':'Send wishes'}</button><time class="brit-red">${he?'היום':'Today'}</time></div></div>
      <div class="brit-deadline"><div class="brit-code">08 NOV</div><div><h3>Eden Ziv</h3><p>Maccabi Haifa / ${he?'חוגג 22':'Turns 22'}</p></div><time>${he?'5 ימים':'5 days'}</time></div></section>
    <section class="brit-module brit-black-module"><div class="brit-module-head"><h2>${T('pend')}</h2><span>${T('pendN')}</span></div>
      ${[['Ben Levi','CF / 30 / €3.00M','Maccabi Tel Aviv',3],['Amit Rosen','DM / 28 / €2.20M','Maccabi Netanya',6]].map(x=>`<div class="brit-approval"><div class="brit-avatar-box">${ini(x[0])}</div><div><h3>${x[0]}</h3><p>${x[1]}<br>${he?`המנדט פג בעוד ${x[3]} ימים`:`Mandate expires in ${x[3]} days`}</p></div><a class="brit-approve-btn" onclick="openDrawer(${x[0]==='Ben Levi'?14:8})">${T('review')}</a></div>`).join('')}</section>
    <section class="brit-module"><div class="brit-module-head"><h2>${T('mw')}</h2><span>${T('mwSub')}</span></div>
      <div class="brit-mandates">${[['Ben Levi',3,'Maccabi Tel Aviv / CF / €3.00M',14],['Amit Rosen',6,'Maccabi Netanya / DM / €2.20M',8],['Roi Dahan',9,'Hapoel Beer Sheva / RW / €1.80M',2]].map(x=>`<article class="brit-mandate"><strong>${x[0]}</strong><span>${he?`${x[1]} ימים נותרו`:`${x[1]} days left`}</span><p>${x[2]}</p><a onclick="openDrawer(${x[3]})">${T('openP')}</a></article>`).join('')}</div></section>
    <section class="brit-module"><div class="brit-module-head"><h2>${T('act')}</h2><span>${he?'מציג 3 מתוך 28':'Showing 3 of 28'}</span></div>
      ${[['Avi N.',he?'עדכן הערה':'Updated note','Ben Levi','10:42'],['Dana K.',he?'הוסיפה בקשה':'Added request','Hapoel Haifa','09:15'],['Avi N.',he?'שינה פוקוס ל״פעיל״':'Set focus to Active','Roi Dahan','Yesterday']].map(a=>`<div class="brit-feed-row"><time>${a[3]}</time><p>${a[0]} / ${a[1]}<strong>${a[2]}</strong></p><span>${he?'פתח':'Open'}</span></div>`).join('')}</section>
   </div>
   <aside>
    <section class="brit-module"><div class="brit-module-head"><h2><span style="color:var(--ink);font:inherit">${T('our')}</span> <span class="brit-heading-gold" style="font:inherit;color:var(--gold)">${T('assets')}</span></h2><span>16</span></div>
      <div class="brit-focus" style="margin-top:18px"><article><div class="brit-focus-copy"><small>Maccabi Haifa</small><h3>Eden Ziv</h3></div></article><article><div class="brit-focus-copy"><small>Maccabi Netanya</small><h3>Amit Rosen</h3></div></article></div></section>
    <section class="brit-module"><div class="brit-module-head"><h2>${T('cr')}</h2><span>${T('crN')}</span></div>
      ${[['03 NOV','Hapoel Haifa','CM · 22–27',he?'חדש':'New'],['01 NOV','Maccabi Netanya','CF · 25–31 / EU',he?'פתוח':'Open'],['29 OCT','Bnei Sakhnin','GK · 20–26',he?'פתוח':'Open']].map(r=>`<div class="brit-feed-row"><time>${r[0]}</time><p>${r[1]}<strong>${r[2]}</strong></p><span>${r[3]}</span></div>`).join('')}
      <a class="brit-new-request">${T('newReq')}</a></section>
    <section class="brit-module" id="ri">${riHTML()}</section>
   </div>
  </div>`;
}
function paint(){document.getElementById('ri').innerHTML=riHTML()}
function renderAll(){
  const r=document.getElementById('room');r.dir=lang==='he'?'rtl':'ltr';r.lang=lang;document.documentElement.dir=r.dir;
  document.getElementById('lb').textContent=lang==='en'?'HE / EN':'EN / HE';
  document.getElementById('lockSub').textContent=T('room');document.getElementById('crumbD').textContent=T('nav')[0];
  document.getElementById('nav').innerHTML=T('nav').map((x,i)=>`<a class="${i===0?'active':''}"><span>${x}</span>${i===1?'<em>16</em>':''}</a>`).join('');
  document.getElementById('canvas').innerHTML=pageHTML();
}
function toggleLang(){lang=lang==='en'?'he':'en';renderAll();if(openId)openDrawer(openId);if(document.getElementById('modal').classList.contains('open'))openInbox()}

/* ---- drawer ---- */
let openId=null;
function openDrawer(id){
  openId=id;const p=byId(id),s=p.s||{},he=lang==='he';
  const sig=[['sPerf',0],['sFm',1],['sVal',2],['sLg',3],['sForm',4]];
  document.getElementById('drawer').innerHTML=`
  <div class="dr-h"><button class="x" onclick="closeAll()">×</button><small>${p.pos} · ${p.age} · ${p.club} · ${mvF(p.mv)}</small><h2>${name(p)}</h2>
    <div class="tags">${lvChip(p.lv)}<span style="color:var(--paper)">${fcTag(p.fc).replace('inherit','var(--paper)')}</span><span style="color:#aaa69c;font:10px var(--mono)">${arrow(p.tr)} ${he?'מגמה':'Trend'}</span></div></div>
  <div class="dr-s"><h4><span>${T('drLevel')}</span><span>${T('conf')} ${p.conf}%</span></h4>
    <div class="ladder">${[1,2,3,4,5].map(l=>`<button class="${p.lv===l?'cur':''} ${s.lv===l&&s.lv!==p.lv?'aim':''}" style="${p.lv===l?`background:${LV[l][0]};color:${LV[l][1]}`:''}" onclick="setLevel(${id},${l})"><b>L${l}</b><small>${T('lvl')[l-1]}</small></button>`).join('')}</div>
    <h4 style="margin-top:20px"><span>${T('drFocus')}</span></h4>
    <div class="fseg">${[1,2,3,4].map(f=>`<button class="${p.fc===f?'cur':''} ${s.fc===f&&s.fc!==p.fc?'aim':''}" style="${p.fc===f?`background:${f===4?'#aba69b':FCOL[f]}`:''}" onclick="setFocus(${id},${f})">${T('fcs')[f-1]}</button>`).join('')}</div></div>
  <div class="dr-s"><h4><span>✦ ${T('drAI')}</span><span>GEMINI 2.5</span></h4><div class="aibox"><div class="t"><span>${he?'מבוסס על הנתונים שלך':'Grounded on your data'}</span><button onclick="typeAI(${id})">${T('rerun')}</button></div><div id="aitx">${p.r[lang]}</div>
    <div class="ev"><div>${T('sPerf')}: ${p.f[0]}/100</div><div>${T('sFm')}: ${p.f[1]}/100</div><div>${T('nLast')}: ${p.t}${T('d')} · ${p.nx[lang==='en'?0:1]}</div></div></div></div>
  <div class="dr-s"><h4><span>${T('drSig')}</span></h4>${sig.map(([k,i])=>`<div class="sigrow"><span>${T(k)}</span><div class="tr"><i style="width:${p.f[i]}%"></i></div><span>${p.f[i]}</span></div>`).join('')}</div>
  <div class="dr-s"><h4><span>${T('drEff')}</span><span>${he?'אוטומטי':'Auto'}</span></h4><div class="touch"><div><b>${p.x[0]}</b>${T('nNotes')}</div><div><b>${p.x[1]}</b>${T('nTasks')}</div><div><b>${p.x[2]}</b>${T('nCont')}</div><div><b>${p.t}${T('d')}</b>${T('nLast')}</div></div></div>
  <div class="dr-s"><h4><span>${T('drNote')}</span></h4><textarea id="nt"></textarea><label style="display:flex;gap:8px;margin-top:12px;font:10px var(--mono)"><input type="checkbox"> ${T('drLock')}</label></div>
  <div class="dr-s"><h4><span>${T('drHist')}</span></h4><div class="tl">${[...HIST[id]].reverse().map(h=>`<div><b>${h.a}</b><br>${h.d} · ${h.w}</div>`).join('')}</div></div>
  <div class="dr-f"><button class="btn gold" onclick="toast(T('sav'))">${T('openFull')}</button></div>`;
  document.getElementById('bd').classList.add('open');document.getElementById('drawer').classList.add('open');
}
function typeAI(id){const p=byId(id),el=document.getElementById('aitx'),t=p.r[lang];el.textContent='';let i=0;const iv=setInterval(()=>{i+=3;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(iv)},16)}
function setLevel(id,l){const p=byId(id);if(l===p.lv)return;const note=(document.getElementById('nt')||{}).value;HIST[id].push({d:'03 Nov 2026',a:`Level L${p.lv} → L${l}${note?` — “${note}”`:''}`,w:'You'});p.lv=l;if(p.s&&p.s.lv===l)delete p.s.lv;toast(`${p.n}: L${l} ${T('lvl')[l-1]}`);openDrawer(id);paint()}
function setFocus(id,f){const p=byId(id);if(f===p.fc)return;const note=(document.getElementById('nt')||{}).value;HIST[id].push({d:'03 Nov 2026',a:`Focus ${D.en.fcs[p.fc-1]} → ${D.en.fcs[f-1]}${note?` — “${note}”`:''}`,w:'You'});p.fc=f;if(p.s&&p.s.fc===f)delete p.s.fc;if(f===1)toast(T('alertSent'));else toast(`${p.n}: ${T('fcs')[f-1]}`);openDrawer(id);paint()}

/* ---- AI inbox modal ---- */
function openInbox(){
  const sg=sugs().sort((a,b)=>b.conf-a.conf);
  document.getElementById('modal').innerHTML=`<button class="close" onclick="closeAll()">×</button><h2>${T('modalT')}</h2><p class="sub">${T('modalS')}</p>
  ${sg.length?`<div style="margin:12px 0"><button class="btn gold" onclick="acceptHigh()">${T('acceptHigh')}</button></div>`:''}
  ${sg.map(p=>{const s=p.s;return `<div class="sg-row"><div><h3>${name(p)}</h3><div class="mv">${s.lv&&s.lv!==p.lv?`${lvChip(p.lv)} → ${lvChip(s.lv)}`:lvChip(p.lv)} ${s.fc&&s.fc!==p.fc?`<span style="margin-inline-start:8px">${fcTag(p.fc)} → ${fcTag(s.fc)}</span>`:''} <span class="conf">${T('conf')} ${p.conf}%</span></div><p><span class="ai">AI</span>${p.r[lang]}</p></div>
   <div class="ac"><button class="btn gold" onclick="acceptS(${p.id})">${T('accept')}</button><button class="btn" onclick="closeAll();openDrawer(${p.id})">${T('adjust')}</button><button class="btn" onclick="dismissS(${p.id})">${T('dismiss')}</button></div></div>`}).join('')||`<div class="brit-empty">${T('done')}</div>`}`;
  document.getElementById('bd').classList.add('open');document.getElementById('modal').classList.add('open');
}
function applyS(p){const s=p.s;if(s.lv&&s.lv!==p.lv){HIST[p.id].push({d:'03 Nov 2026',a:`Level L${p.lv} → L${s.lv} (accepted AI)`,w:'You + Engine'});p.lv=s.lv}if(s.fc&&s.fc!==p.fc){HIST[p.id].push({d:'03 Nov 2026',a:`Focus ${D.en.fcs[p.fc-1]} → ${D.en.fcs[s.fc-1]} (accepted AI)`,w:'You + Engine'});p.fc=s.fc}delete p.s}
function acceptS(id){applyS(byId(id));paint();openInbox();toast('✓')}
function dismissS(id){delete byId(id).s;paint();openInbox()}
function acceptHigh(){const l=sugs().filter(p=>p.conf>=85);l.forEach(applyS);paint();openInbox();toast(`${l.length} ✓`)}
function closeAll(){openId=null;['bd','drawer','modal'].forEach(i=>document.getElementById(i).classList.remove('open'))}

/* ---- mock controls ---- */
function simAlert(){
  const p=byId(9);if(p.fc===1){toast('Already Push now — hit Reset');return}
  p.fc=1;p.nx=['Request match','בקשה מתאימה',1];p.u=78;p.r={en:'A new Hapoel Haifa request (CM, 22–27) matches him exactly. Focus raised from Maintain to Push now.',he:'בקשה חדשה של הפועל חיפה (קשר, 22–27) מתאימה לו בדיוק. הפוקוס הועלה מ״תחזוקה״ ל״לדחוף עכשיו״.'};
  HIST[9].push({d:'03 Nov 2026',a:'Focus Maintain → Push now (new matching request)',w:'Engine'});
  tab='priority';lvFilter=0;flashId=9;paint();
  const n=document.getElementById('notif');n.innerHTML=`<small><span>BRIT · ${T('notifT')}</span><span>now</span></small><b>${name(p)}</b><p>${T('notifP')}</p><button onclick="document.getElementById('notif').classList.remove('show');openDrawer(9)">${T('notifBtn')}</button>`;
  n.classList.add('show');clearTimeout(simAlert.h);simAlert.h=setTimeout(()=>n.classList.remove('show'),7000);
}
function simEmpty(){empty=!empty;paint()}
function resetAll(){const o=JSON.parse(SNAP);P.splice(0,P.length,...o);Object.keys(HIST).forEach(k=>{HIST[k]=HIST[k].filter(h=>h.w==='System'||h.w==='Avi N.')});empty=false;tab='priority';lvFilter=0;showAll=false;flashId=null;closeAll();document.getElementById('notif').classList.remove('show');paint()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
renderAll();
</script>
